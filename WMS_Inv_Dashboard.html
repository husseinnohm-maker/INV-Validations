    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 2px; }

        .dropdown-content {
            display: none;
            position: absolute;
            background-color: #0f172a;
            min-width: 260px;
            max-height: 320px;
            overflow-y: auto;
            border: 1px solid #1e293b;
            border-radius: 8px;
            z-index: 50;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.7);
        }
        .dropdown-content.show { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .animate-fadeIn {
            animation: fadeIn 0.3s ease-in-out;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-300 antialiased overflow-hidden min-h-screen">
    
    <div id="app" class="h-screen w-screen flex flex-col overflow-hidden"></div>

    <script>
        // ══════════════════════════════════════════════════════════════════════════════
        // SIX-TIER CATEGORY ORDER LOCK — All arrays, charts, tables & legends
        // MUST follow this exact sequence. 'Dummy Location Bucket' is always last.
        // ══════════════════════════════════════════════════════════════════════════════
        const APPROVED_STORAGE_CLASSES = [
            'Normal Physical Storage',  // index 0
            'Radio Shuttle',            // index 1
            'Bins',                     // index 2
            'Shelves',                  // index 3
            'POS',                      // index 4
            'Dummy Location Bucket'     // index 5 — ALWAYS LAST
        ];

        // ── MULTI-HEADER ALIAS ARRAYS ─────────────────────────────────────────────
        // Used to discover Location and Storage Type columns regardless of file layout.
        const LOC_COL_ALIASES   = ['location', 'locator', 'item locator', 'location code'];
        const STOR_COL_ALIASES  = ['storage', 'storage type', 'bins/shelves', 'bin shelves', 'storage_type'];
        const ORG_COL_ALIASES   = ['org code', 'org', 'warehouse org', 'orgcode', 'wh org',
                                   'organization', 'warehouse name', 'warehouse'];
        const ZONE_COL_ALIASES  = ['zone name', 'zone_name', 'zone'];

        // ── ALPHANUMERIC MATCH KEY — strips all non-alphanumeric chars for cross-file
        // matching. Dots/dashes in one file won't break matches against cleaner files.
        // e.g. "AC03.01L01.A" → "AC0301L01A" matches "AC0301L01A" exactly.
        // NOTE: only used INTERNALLY for lookups. Raw strings are always preserved
        //       in the display layer (tables, exports, warnings).
        const toMatchKey = (val) => String(val || '').replace(/[^A-Za-z0-9]/g, '').toUpperCase().trim();

        // Helper — find first header matching an alias array (case-insensitive)
        function findColByAliases(headers, aliases) {
            for (const alias of aliases) {
                const found = headers.find(h => h && h.replace(/^﻿/, '').trim().toLowerCase() === alias);
                if (found) return found;
            }
            return null;
        }

        const state = {
            isInitialized: false,
            sohData: [],
            locData: [],
            bulkExclusionKeys: new Set(), // matchKey-indexed exclusion ledger
            loading: false,
            errorMsg: '',
            googleSheetUrl: '',
            showGoogleInput: false,
            columnMapping: {},
            bulkLocations: [],
            zoneMapping: new Map(),
            bulkInputText: '',
            currentPage: 1,
            pageSize: 150,
            filters: {
                search: '',
                orgCodes: [],
                divisions: [],
                actions: [],
                storageTypes: [],
                zones: [],
                headerFilters: {
                    _action: [],
                    Locator: [],
                    'Storage Type': [],
                    'Item Code': [],
                    'LPN NO': [],
                    'EXP Date': [],
                    Division: []
                }
            },
            processedData: [],
            actionSummary: [],
            kpis: {},
            uniqueOrgs: [],
            uniqueDivisions: [],
            uniqueStorageTypes: [],
            uniqueZones: [],
            locationMetrics: {
                available: { total: 0, categories: {} },
                used: { total: 0, categories: {} }
            },
            chartInstance: null,
            activeDropdown: null
        };

        const COLORS = {
            GREEN: '#22c55e', 
            YELLOW: '#eab308', 
            ORANGE: '#f97316', 
            RED: '#ef4444', 
            GREY: '#6b7280', 
            DARK_BG: '#030712', 
            PANEL_BG: '#0f172a', 
            TEXT_MAIN: '#cbd5e1', 
        };

        const TRACKING_TYPES = [
            'WH Damage', 'WH Virtual Locator DZ', 'INBOUND DMG', 'INBDGCNINA', 
            'INBDINCOMA', 'INBD SHEXP', 'INBDQCHOLA', 'INBDQCRTVA', 'INBDSAMPLA', 
            'INBOUND SHORT', 'In Transit', 'Destruction', 'MLSCMSDRSA', 'MLSCQCHOLA', 
            'PLAN WROFF', 'QC', 'QMSTRANTIT', 'RETURN'
        ];

        const COLUMNS = [
            'Org Code', 'Division', 'Supplier', 'Item Category', 'Item Code', 
            'Description', 'PACK', 'Subinv', 'Locator', 'LOC STATUS', 
            'LOT NUM', 'LOT STATUS', 'LPN NO', 'LPN STATUS', 'EXP Date',

            'Source No', 'Supplier LOT', 'Mars Batch', 'Batch Status', 'Cross Ref.'
        ];

        const COLUMN_SYNONYMS = {
            'Org Code': ['org code', 'org', 'warehouse org', 'orgcode', 'wh org', 'organization'],
            'Division': ['division', 'div', 'division code', 'dept'],
            'Supplier': ['supplier', 'vendor', 'supplier name', 'supplier_name'],
            'Item Category': ['item category', 'item catogery', 'category', 'item cat', 'catogery', 'itemcatogery', 'item_category'],
            'Item Code': ['item code', 'item', 'sku', 'product code', 'itemcode', 'sku code', 'product_code', 'item_code'],
            'Description': ['description', 'desc', 'item description', 'product description', 'item_desc'],
            'PACK': ['pack', 'packaging', 'pack config', 'pkg'],

            'Locator': ['locator', 'location', 'bin', 'loc code', 'loc', 'locator_code', 'locator code'],
            'LOC STATUS': ['loc status', 'location status', 'locator status', 'loc_status', 'loc status code'],
            'LOT NUM': ['lot num', 'lot number', 'lot', 'batch/lot', 'lot_num'],
            'LOT STATUS': ['lot status', 'batch status', 'lot status code', 'lot_status', 'lot status code'],
            'LPN NO': ['lpn no', 'lpn number', 'lpn', 'license plate', 'license plate number', 'lpn_no', 'pallet id', 'pallet_id'],
            'LPN STATUS': ['lpn status', 'lpn status code', 'lpn_status'],

            'PUOM': ['puom', 'primary uom', 'uom', 'unit'],
            'PUOM QTY': ['puom qty', 'primary qty', 'qty', 'quantity', 'puom_qty', 'on_hand_qty'],

        const ACTION_LABELS = [

            "Single LPN in Shuttle",

            "LPN Duplication Alert",
            "Bulk Location — Excluded"
        ];

                'check-circle': `<svg class="${className}" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>`,

                'chevron-down': `<svg class="${className}" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>`,

                'link-2': `<svg class="${className}" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 7h3a5 5 0 0 1 5 5 5 5 0 0 1-5 5h-3m-6 0H6a5 5 0 0 1-5-5 5 5 0 0 1 5-5h3"></path><line x1="8" y1="12" x2="16" y2="12"></line></svg>`,
                'search': `<svg class="${className}" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>`,
                'upload-cloud': `<svg class="${className}" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 16 12 12 8 16"></polyline><line x1="12" y1="12" x2="12" y2="21"></line><path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"></path></svg>`,
                'alert-triangle': `<svg class="${className}" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>`,
                'shield-alert': `<svg class="${className}" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7s0 6 8 10z"></path><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>`,
                'file-spreadsheet': `<svg class="${className}" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>`,
                'arrow-right': `<svg class="${className}" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>`,
                'refresh-cw': `<svg class="${className}" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>`,
                'map-pin': `<svg class="${className}" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>`
            };
            return icons[name] || '';
        }

        function generateId() {
            return Math.random().toString(36).substr(2, 9);
        }

        function formatNumber(val) {
            return new Intl.NumberFormat('en-US').format(val || 0);
        }

        function escapeHtmlAttr(str) {
            return String(str || '')
                .replace(/&/g, '&amp;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        }
        
        function parseRobustDate(val) {
            if (!val) return null;
            val = String(val).trim();
            if (!val) return null;
            if (/^\d+(\.\d+)?$/.test(val)) {
                const serial = parseFloat(val);
                const date = new Date((serial - 25569) * 86400 * 1000);
                return isNaN(date.getTime()) ? null : date;
            }
            const dmyMatch = val.match(/^(\d{1,2})[\/\-\.](\d{1,2})[\/\-\.](\d{4})$/);
            if (dmyMatch) {
                const day = parseInt(dmyMatch[1], 10);
                const month = parseInt(dmyMatch[2], 10) - 1;
                const year = parseInt(dmyMatch[3], 10);
                const date = new Date(year, month, day);
                return isNaN(date.getTime()) ? null : date;
            }
            const date = new Date(val);
            return isNaN(date.getTime()) ? null : date;
        }

        function coerceFloat(val) {
            if (val === null || val === undefined) return 0;
            const clean = String(val).replace(/[^0-9\.\-]/g, '');
            const num = parseFloat(clean);
            return isNaN(num) ? 0 : num;
        }

        // ── BULK LOCATOR CHECK ───────────────────────────────────────────────────────
        // Uses the alphanumeric toMatchKey() to compare against the bulkExclusionKeys
        // Set (O(1) lookup) so that "AC03.01L01.A" matches "AC0301L01A" seamlessly.
        // Wildcard patterns entered manually in the sidebar still use the string array.
        function isBulkLocator(loc) {
            if (!loc) return false;
            // First: check alphanumeric matchKey against the ledger set
            const locKey = toMatchKey(loc);
            if (state.bulkExclusionKeys && state.bulkExclusionKeys.has(locKey)) return true;

            // Second: honour manually-entered wildcard rules from the sidebar UI
            const uLoc = String(loc).trim().toUpperCase();
            return state.bulkLocations.some(bulk => {
                const uBulk = String(bulk).trim().toUpperCase();
                if (!uBulk) return false;
                if (uBulk.includes('*')) {
                    const regexStr = '^' + uBulk
                        .replace(/[-\/\\^$+?.()|[\]{}]/g, '\\$&')
                        .replace(/\\\*/g, '.*')
                        .replace(/\*/g, '.*') + '$';
                    try { return new RegExp(regexStr).test(uLoc); } catch(e) { return false; }
                }
                // Exact match on the raw uppercase string for manually entered patterns
                return uLoc === uBulk;
            });
        }

        function mapColumns(headers) {
            const mapping = {};
            COLUMNS.forEach(col => {
                const synonyms = COLUMN_SYNONYMS[col] || [col.toLowerCase()];
                let matched = headers.find(h => h && h.replace(/^\uFEFF/, '').trim().toLowerCase() === col.toLowerCase());
                if (!matched) {
                    matched = headers.find(h => {
                        const normalized = h && h.replace(/^\uFEFF/, '').trim().toLowerCase();
                        return synonyms.includes(normalized);
                    });
                }
                mapping[col] = matched || null;
            });
            return mapping;
        }

        // ── STORAGE CATEGORY CLASSIFIER ─────────────────────────────────────────────
        // Trims, normalises, and case-insensitively matches against the 5 whitelist
        // categories (indices 0-4 of APPROVED_STORAGE_CLASSES). Anything that misses
        // falls into 'Dummy Location Bucket' (index 5). This guarantees Dummy always
        // sorts/renders last everywhere the SIX-TIER ORDER LOCK is applied.
        function determineStorageCategory(rawStorageType) {
            const stType = String(rawStorageType || '').trim();
            if (!stType) return 'Dummy Location Bucket';

            // Match case-insensitively against first 5 whitelist entries only
            const whitelistCheck = ['Normal Physical Storage', 'Radio Shuttle', 'Bins', 'Shelves', 'POS'];
            for (const cat of whitelistCheck) {
                if (stType.toLowerCase() === cat.toLowerCase()) return cat;
            }
            // Unrecognised / empty / out-of-whitelist → Dummy Location Bucket
            return 'Dummy Location Bucket';
        }

        function parseZoneFromLocator(loc) {
            return 'Unassigned';
        }

        function parseStorageTypeFromLocator(loc) {
            if (!loc) return 'Unspecified';
            const clean = String(loc).trim().toUpperCase();
            if (clean.startsWith('S')) return 'Radio Shuttle';
            if (clean.includes('DZ') || clean.includes('DMG') || clean.includes('DUMMY')) return 'Dummy Location Bucket'; // SIX-TIER ORDER LOCK
            return 'Normal Physical Storage';
        }

        function parseAisleLevelFromLocator(loc) {
            if (!loc) return { aisle: 'GEN', level: '01' };
            const clean = String(loc).trim().toUpperCase();
            
            const parts = clean.split('.');
            let aisle = 'GEN';
            let level = '01';
            
            if (parts[0]) {
                aisle = parts[0].substring(0, 4);
            }
            if (parts[1]) {
                const inner = parts[1];
                if (inner.length >= 5) {
                    level = inner.substring(3, 5);
                } else {
                    const lvlMatch = inner.match(/L(\d{2})/);
                    if (lvlMatch) {
                        level = lvlMatch[1];
                    } else {
                        level = inner.substring(0, 2);
                    }
                }
            }
            return { aisle, level };
        }

        // ── BULK EXCLUSION REGISTRY BUILDER ─────────────────────────────────────────
        // Scans location master with alias-based header detection (STOR_COL_ALIASES /
        // LOC_COL_ALIASES). Locations that resolve to 'Dummy Location Bucket' have
        // their toMatchKey() registered in state.bulkExclusionKeys (for fast O(1)
        // lookup during processing) AND their raw display string pushed to
        // state.bulkLocations (rendered as tags in the sidebar).
        function initializeBulkExclusions() {
            state.bulkLocations = [];
            // Global matchKey-indexed exclusion ledger — used in processDataPipeline
            state.bulkExclusionKeys = new Set();

            const mapKey = (row, key) => {
                const userHeader = state.columnMapping[key];
                return userHeader && row[userHeader] !== null && row[userHeader] !== undefined ? String(row[userHeader]).trim() : '';
            };

            // matchKey → raw string lookup so we can register raw display strings
            const locMatchKeyToRaw = new Map();

            if (state.locData && state.locData.length > 0) {
                const headers = Object.keys(state.locData[0]);
                // ── Alias-based column discovery ──────────────────────────────────────
                const storageKeyLoc = findColByAliases(headers, STOR_COL_ALIASES);
                const locKeyLoc     = findColByAliases(headers, LOC_COL_ALIASES);

                state.locData.forEach(locRow => {
                    // Retrieve raw location string (preserve dots/dashes for display)
                    const locRaw = String(
                        locRow['Location'] || locRow['Locator'] ||
                        (locKeyLoc ? locRow[locKeyLoc] : '') || ''
                    ).trim();
                    if (!locRaw) return;

                    const locKey = toMatchKey(locRaw); // alphanumeric backend key
                    locMatchKeyToRaw.set(locKey, locRaw);

                    const rawStorageVal = String(
                        locRow['Storage'] || locRow['Storage Type'] ||
                        (storageKeyLoc ? locRow[storageKeyLoc] : '') || ''
                    ).trim();
                    const cat = determineStorageCategory(rawStorageVal);

                    // Auto-register Dummy Location Bucket entries in the exclusion ledger
                    if (cat === 'Dummy Location Bucket') {
                        state.bulkExclusionKeys.add(locKey);
                        if (!state.bulkLocations.includes(locRaw)) {
                            state.bulkLocations.push(locRaw);
                        }
                    }
                });
            }

            // Also scan SOH for locators not in master that look like dummies/tracking
            if (state.sohData && state.sohData.length > 0) {
                state.sohData.forEach(row => {
                    const locRaw = mapKey(row, 'Locator') || 'UNKNOWN';
                    const locKey = toMatchKey(locRaw);
                    if (!locMatchKeyToRaw.has(locKey)) {
                        const rawStorageType = parseStorageTypeFromLocator(locRaw);
                        const cat = determineStorageCategory(rawStorageType);
                        if (cat === 'Dummy Location Bucket') {
                            state.bulkExclusionKeys.add(locKey);
                            if (!state.bulkLocations.includes(locRaw)) {
                                state.bulkLocations.push(locRaw);
                            }
                        }
                    }
                });
            }
        }

        async function handleGoogleSheetsFetch() {
            if (!state.googleSheetUrl) return;
            state.loading = true;
            state.errorMsg = '';
            render();
            try {
                let finalUrl = state.googleSheetUrl;
                const match = state.googleSheetUrl.match(/\/d\/([a-zA-Z0-9-_]+)/);
                if (match && match[1]) {
                    const docId = match[1];
                    const gidMatch = state.googleSheetUrl.match(/gid=([0-9]+)/);
                    const gid = gidMatch ? gidMatch[1] : '0';
                    finalUrl = `https://docs.google.com/spreadsheets/d/${docId}/export?format=csv&gid=${gid}`;
                }
                const res = await fetch(finalUrl);
                if (!res.ok) throw new Error("Spreadsheet inaccessible or CORS blocked. Please publish to the Web first.");
                const text = await res.text();
                processGoogleSheetCSV(text);
            } catch (err) {
                state.errorMsg = "CORS or Connection Error. Initializing simulated workspace feed instead...";
                render();
                setTimeout(() => {
                    handleLoadSimulatedData();
                }, 1000);
            }

        function handleFileUpload(file, type) {
            if (!file) return;
            state.loading = true;
            state.errorMsg = '';
            render();
            const fileName = file.name.toLowerCase();
            const isExcel = fileName.endsWith('.xlsx') || fileName.endsWith('.xls') || fileName.endsWith('.xlsb');
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    let csvText = '';
                    if (isExcel) {
                        const data = new Uint8Array(e.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        const firstSheet = workbook.SheetNames[0];
                        csvText = XLSX.utils.sheet_to_csv(workbook.Sheets[firstSheet]);
                    } else {
                        csvText = e.target.result;
                    }
                    Papa.parse(csvText, {
                        header: true,
                        skipEmptyLines: 'greedy',
                        transformHeader: function(h) {
                            return h ? h.replace(/^\uFEFF/, '').trim() : '';
                        },
                        complete: (results) => {
                            state.loading = false;
                            
                            const validData = results.data.filter(row => {
                                return Object.values(row).some(v => v !== null && v !== undefined && String(v).trim() !== '');
                            });
                            if (results.errors.length > 0 && validData.length === 0) {
                                state.errorMsg = "Unparseable or entirely empty file detected.";
                                render();
                                return;
                            }
                            
                            if (type === 'SOH') {
                                if (validData.length === 0) {
                                    state.errorMsg = "No valid inventory data rows found in SOH file.";
                                } else {
                                    state.sohData = validData;
                                    const firstRow = validData[0] || {};
                                    state.columnMapping = mapColumns(Object.keys(firstRow));
                                    state.errorMsg = '';
                                }
                            } else {
                                state.locData = validData;
                                state.errorMsg = '';
                            }
                            
                            if (state.isInitialized && state.sohData.length > 0) {
                                initializeBulkExclusions();
                                processDataPipeline();
                            }
                            render();
                        },
                        error: (err) => {
                            state.loading = false;
                            state.errorMsg = "CSV parsing error: " + err.message;
                            render();
                        }
                    });
                } catch (err) {
                    state.loading = false;
                    state.errorMsg = "File processing failure: " + err.message;
                    render();
                }
            };
            if (isExcel) {
                reader.readAsArrayBuffer(file);
            } else {
                reader.readAsText(file);
            }
        }

        function processGoogleSheetCSV(text) {
            Papa.parse(text, {
                header: true,
                skipEmptyLines: 'greedy',
                transformHeader: function(h) {
                    return h ? h.replace(/^\uFEFF/, '').trim() : '';
                },
                complete: (results) => {
                    state.loading = false;
                    const validData = results.data.filter(row => {
                        return Object.values(row).some(v => v !== null && v !== undefined && String(v).trim() !== '');
                    });
                    if (validData.length === 0) {
                        state.errorMsg = "No valid records extracted from Google Sheet.";
                        render();
                        return;
                    }
                    state.sohData = validData;
                    const firstRow = validData[0] || {};
                    state.columnMapping = mapColumns(Object.keys(firstRow));
                    state.errorMsg = '';
                    
                    if (!state.isInitialized) {
                        state.isInitialized = true;
                    }
                    initializeBulkExclusions();
                    processDataPipeline();
                    render();
                }
            });
        }

        // ══════════════════════════════════════════════════════════════════════════════
        // MAIN DATA PROCESSING PIPELINE
        // ── Changes vs original: ─────────────────────────────────────────────────
        // 1. Builds locMap keyed by toMatchKey() (alphanumeric) for cross-file lookup
        //    while preserving raw strings for display (locRawMap).
        // 2. Uses alias arrays (STOR_COL_ALIASES / LOC_COL_ALIASES / etc.) for all
        //    header discovery — no more single-alias blind spots.
        // 3. Removed ALL hardcoded org fallbacks (no 'RW1', 'QW1' anywhere).
        //    Orgs/Divisions are discovered 100% dynamically from uploaded data.
        // 4. determineStorageCategory now returns 'Dummy Location Bucket' (not
        //    'Dummy Location') ensuring the 6-tier order lock renders it last.
        // 5. uniqueStorageTypes is sorted by APPROVED_STORAGE_CLASSES index so every
        //    chart dataset, filter slicer, and KPI row follows the locked order.
        // ══════════════════════════════════════════════════════════════════════════════
        function processDataPipeline() {
            if (!state.sohData || state.sohData.length === 0) return;

            const mapKey = (row, key) => {
                const userHeader = state.columnMapping[key];
                return userHeader && row[userHeader] !== null && row[userHeader] !== undefined ? String(row[userHeader]).trim() : '';
            };

            // ── Dual-key location maps ────────────────────────────────────────────
            // locMap     : matchKey (alphanumeric) → locRow object  (for fast lookup)
            // locRawMap  : matchKey               → raw display string (for UI display)
            const locMap    = new Map();
            const locRawMap = new Map();
            let storageKeyLoc = null;
            let locKeyLoc = null;
            let zoneKeyLoc = null;
            let whKeyLoc = null;
            const activeStorageTypesSet = new Set();
            const orgsSet = new Set();
            const zonesSet = new Set();

            state.locationMetrics = {
                available: { total: 0, categories: {} },
                used: { total: 0, categories: {} }
            };

            if (state.locData && state.locData.length > 0) {
                const headers = Object.keys(state.locData[0]);
                // ── Alias-based column discovery (handles any column naming variant) ──
                storageKeyLoc = findColByAliases(headers, STOR_COL_ALIASES);
                locKeyLoc     = findColByAliases(headers, LOC_COL_ALIASES);
                zoneKeyLoc    = findColByAliases(headers, ZONE_COL_ALIASES);
                whKeyLoc      = findColByAliases(headers, ORG_COL_ALIASES);

                state.locData.forEach(locRow => {
                    // Retrieve raw location string (preserve dots/special chars for display)
                    const locRaw = String(
                        locRow['Location'] || locRow['Locator'] ||
                        (locKeyLoc ? locRow[locKeyLoc] : '') || ''
                    ).trim();
                    if (!locRaw) return;

                    const locKey = toMatchKey(locRaw); // alphanumeric backend key
                    locMap.set(locKey, locRow);        // keyed by matchKey for reliable lookup
                    locRawMap.set(locKey, locRaw);     // raw string preserved for display

                    const rawStorageVal = String(
                        locRow['Storage'] || locRow['Storage Type'] ||
                        (storageKeyLoc ? locRow[storageKeyLoc] : '') || ''
                    ).trim();
                    const category = determineStorageCategory(rawStorageVal);
                    activeStorageTypesSet.add(category);

                    const rawZoneVal = String(
                        locRow['Zone Name'] || locRow['Zone'] ||
                        (zoneKeyLoc ? locRow[zoneKeyLoc] : '') || ''
                    ).trim();
                    if (rawZoneVal) {
                        const lowerZone = rawZoneVal.toLowerCase();
                        if (!state.zoneMapping.has(lowerZone)) {
                            state.zoneMapping.set(lowerZone, rawZoneVal);
                        }
                        zonesSet.add(state.zoneMapping.get(lowerZone));
                    }

                    // ── Dynamic org discovery — NO hardcoded fallbacks ────────────────
                    const whVal = String(
                        locRow['Warehouse Name'] || locRow['Warehouse'] ||
                        locRow['Org Code'] || (whKeyLoc ? locRow[whKeyLoc] : '') || ''
                    ).trim();
                    if (whVal) orgsSet.add(whVal);
                });
            }

            const locStats = {};
            let totalQty = 0;
            let totalVal = 0;
            
            const divisionsSet = new Set();
            const lpnLocationTracker = {};
            const duplicateLPNsSet = new Set();

            // Zone/org data already fully populated above — no duplicate scan needed.
            // Ensure 'Unassigned' always present for stock rows without zone metadata.
            zonesSet.add('Unassigned');

            state.sohData.forEach(row => {
                const loc = mapKey(row, 'Locator') || 'UNKNOWN';
                
                if (isBulkLocator(loc)) {
                    const csQty = coerceFloat(mapKey(row, 'CS QTY'));
                    const puomQty = coerceFloat(mapKey(row, 'PUOM QTY'));
                    const puomCst = coerceFloat(mapKey(row, 'PUOM CST'));
                    totalQty += csQty;
                    totalVal += (puomQty * puomCst);
                    return;
                }
                const org = mapKey(row, 'Org Code') || 'UNKNOWN';
                const division = (mapKey(row, 'Division') || '').trim() || 'Unassigned';
                const lpn = mapKey(row, 'LPN NO') || '';
                const item = mapKey(row, 'Item Code') || '';
                const exp = mapKey(row, 'EXP Date') || '';
                const batch = mapKey(row, 'Supplier LOT') || '';
                const csQty = coerceFloat(mapKey(row, 'CS QTY'));
                const puomQty = coerceFloat(mapKey(row, 'PUOM QTY'));
                const puomCst = coerceFloat(mapKey(row, 'PUOM CST'));
                orgsSet.add(org);
                if (division) divisionsSet.add(division);
                if (lpn) {
                    if (!lpnLocationTracker[lpn]) {
                        lpnLocationTracker[lpn] = new Set();
                    }
                    lpnLocationTracker[lpn].add(loc);
                    if (lpnLocationTracker[lpn].size > 1) {
                        duplicateLPNsSet.add(lpn);
                    }
                }
                if (!locStats[loc]) {
                    locStats[loc] = { 
                        items: new Set(), 
                        lpns: new Set(), 
                        exps: new Set(), 
                        batches: new Set(),
                        rows: []
                    };
                }
                if (item) locStats[loc].items.add(item);
                if (lpn) locStats[loc].lpns.add(lpn);
                if (exp) locStats[loc].exps.add(exp);
                if (batch) locStats[loc].batches.add(batch);
                locStats[loc].rows.push(row);
                totalQty += csQty;
                totalVal += (puomQty * puomCst);
            });

            const processed = [];
            const actionCounts = {};
            let flagsCount = { multiItem: 0, multiLpn: 0, shuttleSingle: 0, multiExp: 0, multiBatch: 0, track: 0, overcapacity: 0, duplicates: 0 };
            
            state.sohData.forEach((row, idx) => {
                const loc = mapKey(row, 'Locator') || 'UNKNOWN';
                const division = (mapKey(row, 'Division') || '').trim() || 'Unassigned';
                const stats = locStats[loc] || { items: new Set(), lpns: new Set(), exps: new Set(), batches: new Set(), rows: [] };
                
                let rawStorageType;
                let zone;
                let coords = parseAisleLevelFromLocator(loc);
                let capacity = 1;
                let masterLoc = {};

                // ── Cross-file location lookup via toMatchKey() ───────────────────────
                // Uses alphanumeric matchKey so "AC03.01L01.A" (QW1 format with dots)
                // correctly matches "AC0301L01A" (AW1 format without dots) in locMap.
                const locKey = toMatchKey(loc);
                if (locMap.has(locKey)) {
                    masterLoc = locMap.get(locKey);

                    const locHeaders = Object.keys(state.locData[0]);
                    // Alias-based storage column discovery within master row
                    const localStorageKeyLoc = findColByAliases(locHeaders, STOR_COL_ALIASES);
                    rawStorageType = String(
                        masterLoc['Storage'] || masterLoc['Storage Type'] ||
                        (localStorageKeyLoc ? masterLoc[localStorageKeyLoc] : '') || ''
                    ).trim();
                    if (!rawStorageType) rawStorageType = 'Unspecified';

                    const localZoneKeyLoc = findColByAliases(locHeaders, ZONE_COL_ALIASES);
                    const rawZone = String(
                        masterLoc['Zone Name'] || masterLoc['Zone'] ||
                        (localZoneKeyLoc ? masterLoc[localZoneKeyLoc] : '') || ''
                    ).trim();
                    zone = rawZone ? (state.zoneMapping.get(rawZone.toLowerCase()) || rawZone) : 'Unassigned';
                } else {
                    rawStorageType = parseStorageTypeFromLocator(loc);
                    zone = 'Unassigned';
                }
                
                const storageCategory = determineStorageCategory(rawStorageType);
                activeStorageTypesSet.add(storageCategory);
                
                if (masterLoc['Capacity']) {
                    capacity = parseInt(masterLoc['Capacity'], 10);
                } else if (masterLoc['Tunnel Capacity']) {
                    capacity = parseInt(masterLoc['Tunnel Capacity'], 10);
                } else if (storageCategory === 'Radio Shuttle') {
                    capacity = 10; 
                }

                const rawLvl = masterLoc['Level'] || masterLoc['level'] || coords.level;
                const level = String(rawLvl).trim().padStart(2, '0');

                const isStandardStorage = ['Normal Physical Storage', 'Radio Shuttle', 'Bins', 'Shelves', 'POS'].includes(storageCategory);
                const isNonShuttleStandard = ['Normal Physical Storage', 'Bins', 'Shelves', 'POS'].includes(storageCategory);
                const isLpnDuplicate = duplicateLPNsSet.has(mapKey(row, 'LPN NO'));
                const isOvercapacity = stats.lpns.size > capacity;
                
                const f_item = isStandardStorage && stats.items.size > 1 ? "Multiple Item/Loc" : "OK";
                const f_lpn = isNonShuttleStandard && stats.lpns.size > 1 ? "Multiple LPN/Loc" : "OK";
                const f_shuttle = storageCategory === 'Radio Shuttle' && stats.lpns.size === 1 ? "Single LPN in Shuttle" : "OK";
                const f_exp = isStandardStorage && stats.exps.size > 1 ? "Multiple Exp/Loc" : "OK";
                const f_batch = isStandardStorage && stats.batches.size > 1 ? "Multiple Batch/Loc" : "OK";
                
                const stTypeString = String(rawStorageType).trim();
                const f_track = TRACKING_TYPES.includes(stTypeString) ? "Track" : "OK";
                let actionLabel = "Matching — No Action Required";
                let actionColor = COLORS.GREEN;
                const subinv = String(mapKey(row, 'Subinv')).toUpperCase();
                
                if (isBulkLocator(loc)) {
                    actionLabel = "Bulk Location — Excluded";
                    actionColor = COLORS.GREY;
                } else if (subinv !== 'SELLABLE' && subinv !== '') {
                    actionLabel = "Unsellable / Dummy";
                    actionColor = COLORS.GREY;
                } else if (loc.toUpperCase().includes('DUMMY') || loc.toUpperCase().includes('DZ') || storageCategory === 'Dummy Location Bucket') {
                    actionLabel = "Unsellable / Dummy";
                    actionColor = COLORS.GREY;
                } else if (isLpnDuplicate) {
                    actionLabel = "LPN Duplication Alert";
                    actionColor = COLORS.RED;
                    flagsCount.duplicates++;
                } else if (isOvercapacity) {
                    actionLabel = "Overcapacity — Locator Overfilled";
                    actionColor = COLORS.RED;
                    flagsCount.overcapacity++;
                } else if (f_track === "Track") {
                    actionLabel = "Tracking — Verify & Action";
                    actionColor = COLORS.RED;
                    flagsCount.track++;
                } else if (f_item !== "OK") {
                    actionLabel = "Multiple Items in Location";
                    actionColor = COLORS.RED;
                    flagsCount.multiItem++;
                } else if (f_exp !== "OK") {
                    actionLabel = "Multiple Expiry Dates in Location";
                    actionColor = COLORS.RED;
                    flagsCount.multiExp++;
                } else if (f_lpn !== "OK") {
                    actionLabel = "Multiple LPNs in Location";
                    actionColor = COLORS.ORANGE;
                    flagsCount.multiLpn++;
                } else if (f_batch !== "OK") {
                    actionLabel = "Multiple Batches in Location";
                    actionColor = COLORS.ORANGE;
                    flagsCount.multiBatch++;
                } else if (f_shuttle !== "OK") {
                    actionLabel = "Single LPN in Shuttle";
                    actionColor = COLORS.YELLOW;
                    flagsCount.shuttleSingle++;
                }
                
                actionCounts[actionLabel] = (actionCounts[actionLabel] || 0) + 1;
                processed.push({
                    _id: idx,
                    'Org Code': mapKey(row, 'Org Code') || 'UNKNOWN',
                    'Division': division,
                    'Supplier': mapKey(row, 'Supplier') || 'UNKNOWN',
                    'Item Category': mapKey(row, 'Item Category') || 'UNKNOWN',
                    'Item Code': mapKey(row, 'Item Code') || 'UNKNOWN',
                    'Description': mapKey(row, 'Description') || 'UNKNOWN',
                    'PACK': mapKey(row, 'PACK') || 'UNKNOWN',
                    'Subinv': mapKey(row, 'Subinv') || 'UNKNOWN',
                    'Locator': loc,
                    'LOT NUM': mapKey(row, 'LOT NUM') || '',
                    'LPN NO': mapKey(row, 'LPN NO') || '',
                    'EXP Date': mapKey(row, 'EXP Date') || '',
                    'PUOM': mapKey(row, 'PUOM') || 'CS',
                    'PUOM QTY': coerceFloat(mapKey(row, 'PUOM QTY')),
                    'CS QTY': coerceFloat(mapKey(row, 'CS QTY')),
                    'PUOM CST': coerceFloat(mapKey(row, 'PUOM CST')),
                    'Storage Type': stTypeString,
                    '_storageCategory': storageCategory,
                    'Zone': zone,
                    'Aisle': coords.aisle,
                    'Level': level,
                    'Capacity': capacity,
                    _stats: { items: stats.items.size, lpns: stats.lpns.size, exps: stats.exps.size, batches: stats.batches.size },
                    _action: actionLabel,
                    _color: actionColor,
                    _expDateObj: parseRobustDate(mapKey(row, 'EXP Date'))
                });
            });

            state.uniqueOrgs = Array.from(orgsSet).filter(Boolean).sort();
            state.uniqueDivisions = Array.from(divisionsSet).filter(Boolean).sort();
            state.uniqueZones = Array.from(zonesSet).filter(Boolean).sort();
            // ── SIX-TIER ORDER LOCK on uniqueStorageTypes ─────────────────────────
            // Sort discovered types by their index in APPROVED_STORAGE_CLASSES so that
            // every filter slicer, chart dataset, and KPI bar follows the locked order.
            // 'Dummy Location Bucket' always appears last (index 5).
            state.uniqueStorageTypes = Array.from(activeStorageTypesSet)
                .filter(Boolean)
                .sort((a, b) => {
                    const ia = APPROVED_STORAGE_CLASSES.indexOf(a);
                    const ib = APPROVED_STORAGE_CLASSES.indexOf(b);
                    return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
                });

            state.processedData = processed;
            state.actionSummary = ACTION_LABELS.map(key => ({
                name: key,
                value: actionCounts[key] || 0,
                color: processed.find(p => p._action === key)?._color || COLORS.GREY
            }));

            state.kpis = {
                totalRows: processed.length,
                flagsCount,
                excludedCount: processed.filter(r => r._action === "Bulk Location — Excluded").length
            };

            const syncFilter = (uniqueList, filterList) => {
                uniqueList.forEach(val => {
                    if (!filterList.includes(val)) filterList.push(val);
                });
            };
            syncFilter(state.uniqueOrgs, state.filters.orgCodes);
            syncFilter(state.uniqueDivisions, state.filters.divisions);
            syncFilter(state.uniqueZones, state.filters.zones);
            syncFilter(state.uniqueStorageTypes, state.filters.storageTypes);
            syncFilter(ACTION_LABELS, state.filters.actions);
        }

        function getGloballyFilteredData() {
            if (state.filters.orgCodes.length === 0) return [];
            if (state.filters.divisions.length === 0) return [];
            if (state.filters.storageTypes.length === 0) return [];
            if (state.filters.zones.length === 0) return [];
            
            return state.processedData.filter(row => {
                if (!state.filters.orgCodes.includes(row['Org Code'])) return false;
                if (!state.filters.divisions.includes(row['Division'])) return false;
                if (!state.filters.storageTypes.includes(row._storageCategory)) return false;
                if (!state.filters.zones.includes(row['Zone'])) return false;
                
                if (state.filters.search) {
                    const searchTerms = state.filters.search.toLowerCase().split(',').map(s => s.trim()).filter(Boolean);
                    if (searchTerms.length > 0) {
                        const rowLoc = String(row['Locator']||'').toLowerCase();
                        const rowItem = String(row['Item Code']||'').toLowerCase();
                        const rowLpn = String(row['LPN NO']||'').toLowerCase();
                        const rowDesc = String(row['Description']||'').toLowerCase();
                        
                        const matchesAny = searchTerms.some(s => 
                            rowLoc.includes(s) || rowItem.includes(s) || rowLpn.includes(s) || rowDesc.includes(s)
                        );
                        if (!matchesAny) return false;
                    }
                }
                return true;
            });
        }

        function getFilteredData() {
            const globalFilter = getGloballyFilteredData();
            return globalFilter.filter(row => {
                if (state.filters.actions.length > 0 && !state.filters.actions.includes(row._action)) return false;
                for (const col in state.filters.headerFilters) {
                    const selectedVals = state.filters.headerFilters[col];
                    if (selectedVals && selectedVals.length > 0) {
                        const val = String(row[col] || '').trim();
                        if (!selectedVals.includes(val)) return false;
                    }
                }
                return true;
            });
        }

            });
            document.getElementById('input-loc-file').addEventListener('change', (e) => {

                    handleFileUpload(e.target.files[0], 'LOC');

                state.showGoogleInput = !state.showGoogleInput;
                render();
            });

                state.googleSheetUrl = document.getElementById('google-sheet-url').value;
                handleGoogleSheetsFetch();
            });
            document.getElementById('btn-launch-console').addEventListener('click', () => {
                if (state.sohData.length > 0) {
                    initializeBulkExclusions();
                    processDataPipeline();
                    state.isInitialized = true;
                    render();
                }
            });
        }

        function initDashboardEvents() {
            document.getElementById('btn-disconnect').addEventListener('click', () => {
                state.isInitialized = false;
                state.sohData = [];
                state.locData = [];
                state.columnMapping = {};
                state.filters.headerFilters = {

                    'Item Code': [],

                    'EXP Date': [],
                    Division: []
                };

            });
            document.getElementById('input-swap-soh').addEventListener('change', (e) => {
                if (e.target.files && e.target.files[0]) {
                    handleFileUpload(e.target.files[0], 'SOH');
                    e.target.value = ''; 
                }
            });
            document.getElementById('input-swap-loc').addEventListener('change', (e) => {
                if (e.target.files && e.target.files[0]) {
                    handleFileUpload(e.target.files[0], 'LOC');

                }
            });
            const searchInput = document.getElementById('search-input');
            if (searchInput) {
                searchInput.addEventListener('input', (e) => {
                    state.filters.search = e.target.value;

                    updateTableAndCharts();
                });
            }
        }

        function addBulkLocatorFromUI() {
            const input = document.getElementById('bulk-locator-input');
            if (!input) return;
            const value = input.value.trim().toUpperCase();
            if (value && !state.bulkLocations.includes(value)) {
                state.bulkLocations.push(value);
                input.value = '';
                processDataPipeline();
                render();
            }
        }
        window.addBulkLocatorFromUI = addBulkLocatorFromUI;

        function removeBulkLocator(loc) {
            state.bulkLocations = state.bulkLocations.filter(b => b !== loc);
            processDataPipeline();
            render();
        }
        window.removeBulkLocator = removeBulkLocator;

        function toggleOrgFilter(org) {
            if (state.filters.orgCodes.includes(org)) {
                state.filters.orgCodes = state.filters.orgCodes.filter(o => o !== org);
            } else {
                state.filters.orgCodes.push(org);
            }
            state.currentPage = 1;
            updateTableAndCharts();
        }
        window.toggleOrgFilter = toggleOrgFilter;

        function toggleHeaderDropdown(event, colKey) {
            event.stopPropagation();
            const targetId = `filter-dropdown-${colKey}`;
            const activeDropdownEl = document.getElementById(targetId);
            if (state.activeDropdown && state.activeDropdown !== activeDropdownEl) {
                state.activeDropdown.classList.remove('show');
            }
            if (activeDropdownEl) {
                activeDropdownEl.classList.toggle('show');
                state.activeDropdown = activeDropdownEl.classList.contains('show') ? activeDropdownEl : null;
            }
        }
        window.toggleHeaderDropdown = toggleHeaderDropdown;

        function syncHeaderFilters() {
            const cols = ['_action', 'Locator', 'Storage Type', 'Item Code', 'LPN NO', 'EXP Date', 'Division'];
            cols.forEach(col => {
                const dropdown = document.getElementById(`filter-dropdown-${col}`);
                if (dropdown) {
                    const checkedCheckboxes = dropdown.querySelectorAll('input[type="checkbox"]:checked');
                    state.filters.headerFilters[col] = Array.from(checkedCheckboxes).map(cb => cb.value);
                }
            });
            state.currentPage = 1;
            updateTableAndCharts();
        }
        window.syncHeaderFilters = syncHeaderFilters;

        function toggleHeaderFilterVal(colKey, val) {
            if (!state.filters.headerFilters[colKey]) {
                state.filters.headerFilters[colKey] = [];
            }
            const arr = state.filters.headerFilters[colKey];
            const index = arr.indexOf(val);
            if (index > -1) {
                arr.splice(index, 1);
            } else {
                arr.push(val);
            }
            
            const dropdown = document.getElementById(`filter-dropdown-${colKey}`);
            if (dropdown) {
                const checkboxes = dropdown.querySelectorAll('input[type="checkbox"]');
                checkboxes.forEach(cb => {
                    if (cb.value === val) {
                        cb.checked = (index === -1);
                    }
                });
            }
            state.currentPage = 1;
            updateTableAndCharts();
        }
        window.toggleHeaderFilterVal = toggleHeaderFilterVal;

        function clearHeaderFilter(event, colKey) {
            event.stopPropagation();
            state.filters.headerFilters[colKey] = [];
            
            const dropdown = document.getElementById(`filter-dropdown-${colKey}`);
            if (dropdown) {
                dropdown.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = false);
            }
            updateTableAndCharts();
        }
        window.clearHeaderFilter = clearHeaderFilter;

        function closeActiveDropdown(event) {
            if (event) event.stopPropagation();
            if (state.activeDropdown) {
                state.activeDropdown.classList.remove('show');
                state.activeDropdown = null;
            }
        }
        window.closeActiveDropdown = closeActiveDropdown;

        function filterHeaderChecklist(event, colKey) {
            const query = event.target.value.toLowerCase().trim();
            const container = document.getElementById(`checklist-${colKey}`);
            if (!container) return;
            const labels = container.querySelectorAll('label');
            labels.forEach(label => {
                const text = label.textContent.toLowerCase();
                if (text.includes(query)) {
                    label.classList.remove('hidden');
                } else {
                    label.classList.add('hidden');
                }
            });
        }
        window.filterHeaderChecklist = filterHeaderChecklist;

        function changePage(direction) {
            const filtered = getFilteredData();
            const totalFiltered = filtered.length;
            const totalPages = Math.ceil(totalFiltered / state.pageSize) || 1;
            
            if (direction === 'prev') {
                state.currentPage = Math.max(1, state.currentPage - 1);
            } else if (direction === 'next') {
                state.currentPage = Math.min(totalPages, state.currentPage + 1);
            } else if (direction === 'first') {
                state.currentPage = 1;
            } else if (direction === 'last') {
                state.currentPage = totalPages;
            }
            updateTableAndCharts();
        }
        window.changePage = changePage;

        function changePageSize(size) {
            state.pageSize = parseInt(size, 10);
            state.currentPage = 1;
            updateTableAndCharts();
        }
        window.changePageSize = changePageSize;

        document.addEventListener('click', (e) => {
            if (state.activeDropdown && !state.activeDropdown.contains(e.target)) {
                closeActiveDropdown();
            }
        });

        const setTxt = (id, txt) => { 
            const el = document.getElementById(id); 
            if (el) el.innerHTML = txt; 
        };

        function updateTableAndCharts() {
            const globallyFiltered = getGloballyFilteredData();

            const tbody = document.getElementById('tbody-grid-stream');
            if (tbody) {
                const totalFiltered = filtered.length;
                const totalPages = Math.ceil(totalFiltered / state.pageSize) || 1;
                if (state.currentPage > totalPages) state.currentPage = totalPages;
                if (state.currentPage < 1) state.currentPage = 1;
                const pageData = filtered.slice((state.currentPage - 1) * state.pageSize, state.currentPage * state.pageSize);
                tbody.innerHTML = pageData.map(row => `
                    <tr class="hover:bg-slate-800/40 transition-colors animate-fadeIn font-mono text-xs">

                if (paginationControls) {

                    const endIdx = Math.min(state.currentPage * state.pageSize, totalFiltered);
                    
                    paginationControls.innerHTML = `
                        <div class="flex items-center gap-4">

                                Showing <span class="font-bold text-white font-mono">${startIdx}</span> to <span class="font-bold text-white font-mono">${endIdx}</span> of <span class="font-bold text-cyan-400 font-mono">${formatNumber(totalFiltered)}</span> records

                        <div class="flex items-center gap-1 font-mono">
                            <button onclick="changePage('first')" ${state.currentPage === 1 ? 'disabled' : ''} class="px-2 py-1 rounded bg-slate-800 hover:bg-slate-700 text-white disabled:opacity-30 disabled:hover:bg-slate-800 transition-colors">&lt;&lt;</button>
                            <button onclick="changePage('prev')" ${state.currentPage === 1 ? 'disabled' : ''} class="px-2 py-1 rounded bg-slate-800 hover:bg-slate-700 text-white disabled:opacity-30 disabled:hover:bg-slate-800 transition-colors">&lt; Prev</button>
                            <span class="px-3 py-1 bg-slate-950 border border-slate-800 rounded text-slate-300 font-mono">

                            <button onclick="changePage('last')" ${state.currentPage === totalPages ? 'disabled' : ''} class="px-2 py-1 rounded bg-slate-800 hover:bg-slate-700 text-white disabled:opacity-30 disabled:hover:bg-slate-800 transition-colors">&gt;&gt;</button>

            }

            const recordBadge = document.getElementById('table-record-badge');
            if (recordBadge) {
                recordBadge.textContent = `Filtering ${formatNumber(filtered.length)} / ${formatNumber(state.kpis.totalRows || state.processedData.length)} records`;
            }

            const activeLocators = new Set();
            const activeLpns = new Set();
            const activeSkus = new Set();
            const excludedLocators = new Set();
            let exp30 = 0, exp90 = 0, level01Exp15 = 0, problemCount = 0;
            const now = new Date();
            const plus15 = new Date(); plus15.setDate(now.getDate() + 15);
            const plus30 = new Date(); plus30.setDate(now.getDate() + 30);
            const plus90 = new Date(); plus90.setDate(now.getDate() + 90);

            globallyFiltered.forEach(r => {
                if (r._action === "Bulk Location — Excluded") {
                    if (r['Locator']) excludedLocators.add(r['Locator']);
                } else {
                    if (r['Locator']) activeLocators.add(r['Locator']);
                    if (r['LPN NO']) activeLpns.add(r['LPN NO']);
                    if (r['Item Code']) activeSkus.add(r['Item Code']);
                    
                    if (r._expDateObj) {
                        if (r._expDateObj <= plus30) exp30++;
                        else if (r._expDateObj <= plus90) exp90++;
                        
                        const rowLevelClean = String(r.Level).trim().padStart(2, '0');
                        if (rowLevelClean === '01' && r._expDateObj <= plus15) {
                            level01Exp15++;
                        }
                    }
                    if (r._color !== COLORS.GREEN && r._color !== COLORS.GREY) {
                        problemCount++;
                    }
                }
            });

            const cleanPct = globallyFiltered.length > 0 ? (((globallyFiltered.length - problemCount) / globallyFiltered.length) * 100).toFixed(2) : "100.00";
            setTxt('kpi-locators', formatNumber(activeLocators.size));

            setTxt('kpi-skus', `${formatNumber(activeSkus.size)} SKUs Registered`);
            setTxt('kpi-clean-pct', `${cleanPct}% Clean`);
            
            const cleanBar = document.getElementById('kpi-clean-bar');
            if (cleanBar) cleanBar.style.width = `${cleanPct}%`;
            setTxt('kpi-exp30', `${formatNumber(exp30)} <span class="text-xs text-slate-500 font-mono font-bold">≤30D</span>`);
            setTxt('kpi-exp90', `${formatNumber(exp90 + exp30)} ≤90 days expiry window`);
            const expGround = document.getElementById('kpi-exp-ground');
            if (expGround) {
                expGround.innerHTML = `${formatNumber(level01Exp15)} <span class="text-xs text-slate-500 font-mono">Pallets</span>`;
                expGround.className = level01Exp15 > 0 ? "text-2xl font-bold text-red-500 font-mono animate-pulse" : "text-2xl font-bold text-slate-300 font-mono";
            }
            
            const expPing = document.getElementById('kpi-exp-ping');
            if (expPing) {
                expPing.style.display = level01Exp15 > 0 ? 'block' : 'none';
            }

            const mixStoragePctCalculated = activeLocators.size > 0 ? ((globallyFiltered.filter(r => r._action === "Multiple Items in Location").length / activeLocators.size) * 100).toFixed(1) : 0;
            const densityRatioCalculated = activeLocators.size > 0 ? (activeLpns.size / activeLocators.size).toFixed(2) : 0;
            const excludedEfficiencyCalculated = globallyFiltered.filter(r => r._action === "Bulk Location — Excluded").length;
            setTxt('diag-mix', `${mixStoragePctCalculated}%`);
            setTxt('diag-density', densityRatioCalculated);
            setTxt('diag-excl', formatNumber(excludedEfficiencyCalculated));

            const excludedLocatorsKpi = document.getElementById('kpi-excluded-locs');
            if (excludedLocatorsKpi) {
                excludedLocatorsKpi.textContent = `${formatNumber(excludedLocators.size)} locator record${excludedLocators.size !== 1 ? 's' : ''} excluded as bulk`;

            let advisoryListHTML = '';

                const fc = state.kpis.flagsCount;
                if (level01Exp15 > 0) {
                    advisoryListHTML += `
                        <div class="p-3 bg-red-950/40 border border-red-500/40 rounded-lg flex items-start gap-3 col-span-1 md:col-span-2 shadow-[0_0_15px_rgba(239,68,68,0.15)] animate-pulse font-mono">

                if (fc.duplicates > 0) {
                    advisoryListHTML += `

                            ${getSVGIcon('layers', 'text-red-400 w-5 h-5 shrink-0 mt-0.5')}

                                <h4 class="font-bold text-white text-xs">Underutilized Shuttle Lanes</h4>

            const level01TableBody = document.getElementById('tbody-level01-expiries');

                level01TableBody.innerHTML = level01Rows.slice(0, 15).map(row => `
                    <tr class="hover:bg-slate-800/40 transition-colors font-mono">

                if (level01Rows.length === 0) {

                                    <svg class="w-8 h-8 text-green-400 opacity-50" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                                    No critical ground-level picking shelf expiries found!
                                </span>
                            </td>
                        </tr>
                    `;
                }
            }

            const allExpiryTableBody = document.getElementById('tbody-all-expiries');
            if (allExpiryTableBody) {
                const allExpiryRows = globallyFiltered.filter(row => {
                    return row._action !== "Bulk Location — Excluded" && row._expDateObj && row._expDateObj <= plus90;
                });
                setTxt('all-expiry-badge', `${allExpiryRows.length} Alerts`);
                allExpiryTableBody.innerHTML = allExpiryRows.slice(0, 15).map(row => {
                    const severityColor = row._expDateObj <= now ? 'text-red-500 font-bold font-mono' : (row._expDateObj <= plus30 ? 'text-orange-400 font-medium font-mono' : 'text-yellow-400 font-mono');
                    return `
                        <tr class="hover:bg-slate-800/40 transition-colors font-mono">
                            <td class="py-2">${row['Locator']}</td>
                            <td class="py-2 text-slate-300 font-medium">${row['Item Code']}</td>
                            <td class="py-2 ${severityColor}">${row['EXP Date']}</td>
                            <td class="py-2 text-right text-slate-400">${formatNumber(row['CS QTY'])}</td>

                    `;
                }).join('');

                if (allExpiryRows.length === 0) {
                    allExpiryTableBody.innerHTML = `
                        <tr>
                            <td colSpan="4" class="py-12 text-center text-slate-500 text-xs font-mono">
                                No expiring stock tracked!
                            </td>
                        </tr>
                    `;
                }
            }

            const matrixTableBody = document.getElementById('tbody-matrix-org');
            if (matrixTableBody) {
                const summariesFiltered = {};
                state.uniqueOrgs.forEach(org => {
                    summariesFiltered[org] = {};
                    ACTION_LABELS.forEach(act => { summariesFiltered[org][act] = { count: 0 }; });
                });
                globallyFiltered.forEach(row => {
                    const org = row['Org Code'];
                    const act = row._action;
                    if (summariesFiltered[org] && summariesFiltered[org][act]) {
                        summariesFiltered[org][act].count++;
                    }
                });
                matrixTableBody.innerHTML = state.uniqueOrgs.flatMap(org => 
                    ACTION_LABELS.map(act => {
                        const stat = summariesFiltered[org]?.[act] || { count: 0 };
                        if (stat.count === 0) return '';
                        const color = state.processedData.find(p => p._action === act)?._color || COLORS.GREY;
                        return `
                            <tr class="hover:bg-slate-800/40 transition-colors font-mono">
                                <td class="py-2.5 font-bold text-white">${org}</td>

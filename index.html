        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 2px; }

        .dropdown-content {
            display: none;
            position: absolute;
            background-color: #0f172a;
            min-width: 260px;
            max-height: 320px;
            overflow-y: auto;
            border: 1px solid #1e293b;
            border-radius: 8px;
            z-index: 50;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.7);
        }
        .dropdown-content.show { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .animate-fadeIn {
            animation: fadeIn 0.3s ease-in-out;
        }

    <script>
        // ══════════════════════════════════════════════════════════════════════════════
        // SIX-TIER CATEGORY ORDER LOCK — All arrays, charts, tables & legends
        // MUST follow this exact sequence. 'Dummy Location Bucket' is always last.
        // ══════════════════════════════════════════════════════════════════════════════
        const APPROVED_STORAGE_CLASSES = [
            'Normal Physical Storage',  // index 0
            'Radio Shuttle',            // index 1
            'Bins',                     // index 2
            'Shelves',                  // index 3
            'POS',                      // index 4
            'Dummy Location Bucket'     // index 5 — ALWAYS LAST
        ];

        // ── MULTI-HEADER ALIAS ARRAYS ─────────────────────────────────────────────
        const LOC_COL_ALIASES   = ['location', 'locator', 'item locator', 'location code'];
        const STOR_COL_ALIASES  = ['storage', 'storage type', 'bins/shelves', 'bin shelves', 'storage_type'];
        const ORG_COL_ALIASES   = ['org code', 'org', 'warehouse org', 'orgcode', 'wh org',
                                   'organization', 'warehouse name', 'warehouse'];
        const ZONE_COL_ALIASES  = ['zone name', 'zone_name', 'zone'];
        const CAPACITY_COL_ALIASES = ['capacity', 'tunnel capacity', 'location capacity', 'max lpn', 'max lpns', 'pallet capacity'];

        // General normalization is used for values such as Org, Division, SKU, Lot and LPN.
        // Do NOT use it for locators: punctuation can be structurally meaningful in WMS location codes.
        const toMatchKey = (val) => String(val || '').replace(/[^A-Za-z0-9]/g, '').toUpperCase().trim();

        // Locator-specific key: case-insensitive and trimmed, while preserving all punctuation.
        // Example: DJ01.12L02.A and DJ0112L02A remain two different locations.
        const toLocationKey = (val) => String(val || '').trim().toUpperCase();

        function findColByAliases(headers, aliases) {
            for (const alias of aliases) {
                const found = headers.find(h => h && h.replace(/^﻿/, '').trim().toLowerCase() === alias);
                if (found) return found;
            }
            return null;
        }

            sohData: [],
            locData: [],

        const FLAG_CARD_CONFIG = [
            { key: 'overcapacity', action: 'Overcapacity — Locator Overfilled', label: 'Overcapacity / Overfill', tone: 'critical' },
            { key: 'duplicates', action: 'LPN Duplication Alert', label: 'LPN Duplication Alerts', tone: 'critical' },

            { key: 'unmappedStorage', action: 'Unmapped Storage Type / Classification', label: 'Unmapped Storage Classification', tone: 'critical' },

            { key: 'nonPositiveQty', action: 'Zero / Negative Inventory Quantity', label: 'Zero / Negative Quantity', tone: 'critical' },
            { key: 'lpnMultiSku', action: 'Same LPN — Multiple SKUs', label: 'Same LPN: Multiple SKUs', tone: 'critical' },

            { key: 'multiBatch', action: 'Multiple Batches in Location', label: 'Multiple Batches / Loc', tone: 'high' },
            { key: 'invalidCapacity', action: 'Missing / Invalid Location Capacity', label: 'Missing / Invalid Capacity', tone: 'high' },
            { key: 'shuttleSingle', action: 'Single LPN in Shuttle', label: 'Single LPN in Shuttle', tone: 'warning' },
            { key: 'tracking', action: 'Tracking — Verify & Action', label: 'Tracking / Verify & Action', tone: 'critical' }
        ];

        const ACTION_PRIORITY = [
            'Missing Mandatory Inventory Data',
            'Location Missing from Master',
            'Org Mismatch with Location Master',
            'Unmapped Storage Type / Classification',
            'Status Conflict — Sellable Stock',
            'Expired Sellable Stock',
            'LPN Duplication Alert',
            'Same LPN — Multiple SKUs',
            'Same LPN — Multiple Lots / Expiry',
            'Same Batch — Different Expiry',
            'Duplicate Inventory Record',
            'Overcapacity — Locator Overfilled',
            'Multiple Divisions in Location',
            'Multiple Subinventories in Location',
            'Multiple Items in Location',
            'Multiple Expiry Dates in Location',
            'Multiple LPNs in Location',
            'Multiple Batches in Location',
            'Missing / Invalid Location Capacity',
            'Zero / Negative Inventory Quantity',
            'Single LPN in Shuttle'
        ];

        function getActionColor(action) {
            return (ACTION_META[action] && ACTION_META[action].color) || COLORS.GREY;
        }

        function blankFlagCounts() {
            return Object.fromEntries(FLAG_CARD_CONFIG.map(flag => [flag.key, 0]));
        }

        function getIssueCounts(rows) {
            const counts = blankFlagCounts();
            rows.forEach(row => {
                const issues = Array.isArray(row._issues) ? row._issues : [row._action];
                issues.forEach(issue => {
                    const key = ACTION_META[issue] && ACTION_META[issue].flagKey;
                    if (key && Object.prototype.hasOwnProperty.call(counts, key)) counts[key]++;
                });
            });
            return counts;
        }

        function getFlagCardsHTML() {
            const classes = {
                critical: 'bg-red-950/20 border-red-500/20 text-red-400 bg-red-500/10',
                high: 'bg-orange-950/20 border-orange-500/20 text-orange-400 bg-orange-500/10',
                warning: 'bg-yellow-950/20 border-yellow-500/20 text-yellow-400 bg-yellow-500/10'
            };
            return FLAG_CARD_CONFIG.map(flag => {
                const tone = classes[flag.tone] || classes.critical;
                const parts = tone.split(' ');
                return `
                    <button type="button" onclick="filterToIssue('${flag.action}')" title="Filter the grid to ${flag.action}" class="w-full flex justify-between items-center gap-3 p-2.5 ${parts[0]} border ${parts[1]} rounded-xl hover:brightness-125 transition text-left animate-fadeIn font-mono">
                        <span class="${parts[2]} text-xs font-medium leading-tight">${flag.label}</span>
                        <span id="flag-${flag.key}" class="shrink-0 text-xs font-bold ${parts[3]} px-2 py-0.5 rounded ${parts[2]} font-mono">0</span>
                    </button>
                `;
            }).join('');
        }

        function getFirstNonBlankValue(row, candidates = [], fallbackHeader = null) {
            for (const candidate of candidates) {
                if (Object.prototype.hasOwnProperty.call(row, candidate) && row[candidate] !== null && row[candidate] !== undefined) {
                    const value = String(row[candidate]).trim();
                    if (value !== '') return value;
                }
            }
            if (fallbackHeader && Object.prototype.hasOwnProperty.call(row, fallbackHeader) && row[fallbackHeader] !== null && row[fallbackHeader] !== undefined) {
                return String(row[fallbackHeader]).trim();
            }
            return '';
        }

        function isApprovedStorageType(rawStorageType) {
            const value = String(rawStorageType || '').trim().toLowerCase();
            return APPROVED_STORAGE_CLASSES.slice(0, 5).some(category => category.toLowerCase() === value);
        }

        function isTrackingStorageType(rawStorageType) {
            const value = String(rawStorageType || '').trim().toLowerCase();
            return TRACKING_TYPES.some(type => type.toLowerCase() === value);
        }

        function isExplicitNonSellableStorage(rawStorageType, locator = '') {
            const storage = String(rawStorageType || '').trim().toUpperCase();
            const loc = String(locator || '').trim().toUpperCase();
            if (isTrackingStorageType(rawStorageType)) return true;
            return storage.includes('DUMMY') || storage.includes('UNSELLABLE') || loc.includes('DUMMY') || loc.includes('DMG') || loc.startsWith('DZ');
        }

        function buildCompositeKey(...parts) {
            return parts.map(part => toMatchKey(part) || '∅').join('|');
        }

        // Use this for all validations that compare inventory by physical location.
        // Org remains normalized, but the locator itself retains meaningful separators.
        function buildLocationKey(org, locator) {
            return `${toMatchKey(org) || '∅'}|${toLocationKey(locator) || '∅'}`;
        }

        // Duplicate-record validation also needs an exact locator key; otherwise two distinct
        // locations that differ only by punctuation could be incorrectly treated as duplicates.
        function buildInventoryRecordKey(org, division, locator, lpn, item, batch, expiry, puomQty, csQty) {
            return [
                toMatchKey(org) || '∅',
                toMatchKey(division) || '∅',
                toLocationKey(locator) || '∅',
                toMatchKey(lpn) || '∅',
                toMatchKey(item) || '∅',
                toMatchKey(batch) || '∅',
                toMatchKey(expiry) || '∅',
                toMatchKey(puomQty) || '∅',
                toMatchKey(csQty) || '∅'
            ].join('|');
        }

        function isBlockingInventoryStatus(value) {
            const status = String(value || '').trim().toUpperCase();
            if (!status) return false;
            return /(HOLD|BLOCK|DAMAGE|EXPIRED|\bQC\b|QUARANTINE|RETURN|REJECT|UNSELLABLE|SUSPEND)/.test(status);
        }

        function getSafeSheetName(actionName, usedNames) {
            const aliases = {
                'Tracking — Verify & Action': 'Tracking',
                'Multiple Items in Location': 'Multiple Items',
                'Multiple Expiry Dates in Location': 'Multiple Expiries',
                'Multiple LPNs in Location': 'Multiple LPNs',
                'Multiple Batches in Location': 'Multiple Batches',
                'Multiple Divisions in Location': 'Multiple Divisions',
                'Multiple Subinventories in Location': 'Multi Subinventories',
                'Overcapacity — Locator Overfilled': 'Overcapacity',
                'LPN Duplication Alert': 'LPN Duplications',
                'Expired Sellable Stock': 'Expired Sellable',
                'Status Conflict — Sellable Stock': 'Status Conflict',
                'Location Missing from Master': 'Master Location Missing',
                'Org Mismatch with Location Master': 'Org Master Mismatch',
                'Zero / Negative Inventory Quantity': 'Zero Negative Quantity',
                'Missing Mandatory Inventory Data': 'Missing Mandatory Data',
                'Same LPN — Multiple SKUs': 'LPN Multiple SKUs',
                'Same LPN — Multiple Lots / Expiry': 'LPN Multiple Lot Expiry',
                'Same Batch — Different Expiry': 'Batch Expiry Conflict',
                'Duplicate Inventory Record': 'Duplicate Records',
                'Missing / Invalid Location Capacity': 'Invalid Capacity',
                'Unmapped Storage Type / Classification': 'Unmapped Storage'
            };
            let base = (aliases[actionName] || actionName).replace(/[\\\/?*\[\]:]/g, '-').replace('—', '-').trim();
            if (!base) base = 'Issues';
            base = base.substring(0, 31).trim();
            let candidate = base;
            let suffix = 2;
            while (usedNames.has(candidate)) {
                const suffixText = ` (${suffix})`;
                candidate = `${base.substring(0, 31 - suffixText.length)}${suffixText}`;
                suffix++;
            }
            usedNames.add(candidate);
            return candidate;
        }

        function formatNumber(val) {
            return new Intl.NumberFormat('en-US').format(val || 0);
        }

        function escapeHtmlAttr(str) {
            return String(str || '')
                .replace(/&/g, '&amp;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        }
        
        function parseRobustDate(val) {
            if (!val) return null;
            val = String(val).trim();
            if (!val) return null;
            if (/^\d+(\.\d+)?$/.test(val)) {
                const serial = parseFloat(val);
                const date = new Date((serial - 25569) * 86400 * 1000);
                return isNaN(date.getTime()) ? null : date;
            }
            const dmyMatch = val.match(/^(\d{1,2})[\/\-\.](\d{1,2})[\/\-\.](\d{4})$/);
            if (dmyMatch) {
                const day = parseInt(dmyMatch[1], 10);
                const month = parseInt(dmyMatch[2], 10) - 1;
                const year = parseInt(dmyMatch[3], 10);
                const date = new Date(year, month, day);
                return isNaN(date.getTime()) ? null : date;
            }
            const date = new Date(val);
            return isNaN(date.getTime()) ? null : date;
        }

        function coerceFloat(val) {
            if (val === null || val === undefined) return 0;
            const clean = String(val).replace(/[^0-9\.\-]/g, '');
            const num = parseFloat(clean);
            return isNaN(num) ? 0 : num;
        }

        function isBulkLocator(loc) {
            if (!loc) return false;
            const locKey = toLocationKey(loc);
            if (state.bulkExclusionKeys && state.bulkExclusionKeys.has(locKey)) return true;

            const uLoc = String(loc).trim().toUpperCase();
            return state.bulkLocations.some(bulk => {
                const uBulk = String(bulk).trim().toUpperCase();
                if (!uBulk) return false;
                if (uBulk.includes('*')) {
                    const regexStr = '^' + uBulk
                        .replace(/[-\/\\^$+?.()|[\]{}]/g, '\\$&')
                        .replace(/\\\*/g, '.*')
                        .replace(/\*/g, '.*') + '$';
                    try { return new RegExp(regexStr).test(uLoc); } catch(e) { return false; }
                }
                return uLoc === uBulk;
            });
        }

        function mapColumns(headers) {
            const mapping = {};
            COLUMNS.forEach(col => {
                const synonyms = COLUMN_SYNONYMS[col] || [col.toLowerCase()];
                let matched = headers.find(h => h && h.replace(/^\uFEFF/, '').trim().toLowerCase() === col.toLowerCase());
                if (!matched) {
                    matched = headers.find(h => {
                        const normalized = h && h.replace(/^\uFEFF/, '').trim().toLowerCase();
                        return synonyms.includes(normalized);
                    });
                }
                mapping[col] = matched || null;
            });
            return mapping;
        }

        function determineStorageCategory(rawStorageType) {
            const stType = String(rawStorageType || '').trim();
            if (!stType) return 'Dummy Location Bucket';

            const whitelistCheck = ['Normal Physical Storage', 'Radio Shuttle', 'Bins', 'Shelves', 'POS'];
            for (const cat of whitelistCheck) {
                if (stType.toLowerCase() === cat.toLowerCase()) return cat;
            }
            return 'Dummy Location Bucket';
        }

        function parseZoneFromLocator(loc) {
            return 'Unassigned';
        }

        function parseStorageTypeFromLocator(loc) {
            if (!loc) return 'Unspecified';
            const clean = String(loc).trim().toUpperCase();
            if (clean.startsWith('S')) return 'Radio Shuttle';
            if (clean.includes('DZ') || clean.includes('DMG') || clean.includes('DUMMY')) return 'Dummy Location Bucket';
            return 'Normal Physical Storage';
        }

        function parseAisleLevelFromLocator(loc) {
            if (!loc) return { aisle: 'GEN', level: '01' };
            const clean = String(loc).trim().toUpperCase();
            
            const parts = clean.split('.');
            let aisle = 'GEN';
            let level = '01';
            
            if (parts[0]) {
                aisle = parts[0].substring(0, 4);
            }
            if (parts[1]) {
                const inner = parts[1];
                if (inner.length >= 5) {
                    level = inner.substring(3, 5);
                } else {
                    const lvlMatch = inner.match(/L(\d{2})/);
                    if (lvlMatch) {
                        level = lvlMatch[1];
                    } else {
                        level = inner.substring(0, 2);
                    }
                }
            }
            return { aisle, level };
        }

        function initializeBulkExclusions() {
            state.bulkLocations = [];
            state.bulkExclusionKeys = new Set();

            const locMatchKeyToRaw = new Map();

            if (state.locData && state.locData.length > 0) {
                const headers = Object.keys(state.locData[0]);
                const storageKeyLoc = findColByAliases(headers, STOR_COL_ALIASES);
                const locKeyLoc     = findColByAliases(headers, LOC_COL_ALIASES);

                state.locData.forEach(locRow => {
                    const locRaw = getFirstNonBlankValue(locRow, ['Location', 'Locator'], locKeyLoc);
                    if (!locRaw) return;

                    const locKey = toLocationKey(locRaw);
                    locMatchKeyToRaw.set(locKey, locRaw);

                    const rawStorageVal = getFirstNonBlankValue(locRow, ['Storage', 'Storage Type'], storageKeyLoc);
                    // Only known non-sellable / tracking coordinates are auto-excluded. Unknown
                    // classifications remain active and are surfaced by the Unmapped Storage validation.
                    if (isExplicitNonSellableStorage(rawStorageVal, locRaw)) {
                        state.bulkExclusionKeys.add(locKey);
                        if (!state.bulkLocations.includes(locRaw)) state.bulkLocations.push(locRaw);
                    }
                });
            }

            if (state.sohData && state.sohData.length > 0) {
                state.sohData.forEach(row => {
                    const userHeader = state.columnMapping['Locator'];
                    const locRaw = userHeader && row[userHeader] !== null && row[userHeader] !== undefined
                        ? String(row[userHeader]).trim()
                        : '';
                    if (!locRaw) return;
                    const locKey = toLocationKey(locRaw);
                    if (!locMatchKeyToRaw.has(locKey) && isExplicitNonSellableStorage('', locRaw)) {
                        state.bulkExclusionKeys.add(locKey);
                        if (!state.bulkLocations.includes(locRaw)) state.bulkLocations.push(locRaw);
                    }
                });
            }
        }

                const match = state.googleSheetUrl.match(/\/d\/([a-zA-Z0-9-_]+)/);

                    const docId = match[1];
                    const gidMatch = state.googleSheetUrl.match(/gid=([0-9]+)/);
                    const gid = gidMatch ? gidMatch[1] : '0';
                    finalUrl = `https://docs.google.com/spreadsheets/d/${docId}/export?format=csv&gid=${gid}`;

                const res = await fetch(finalUrl);
                if (!res.ok) throw new Error("Spreadsheet inaccessible or CORS blocked. Please publish to the Web first.");

        function buildCsvDownload(rows, headers, filename) {
            const csvContent = 'data:text/csv;charset=utf-8,'
                + headers.join(',') + '\n'
                + rows.map(row => headers.map(header => `"${String(csvValue(row, header)).replace(/"/g, '""')}"`).join(',')).join('\n');
            const link = document.createElement('a');
            link.setAttribute('href', encodeURI(csvContent));
            link.setAttribute('download', filename);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

            const wb = XLSX.utils.book_new();
            const groups = {};
            rowsWithIssues.forEach(row => {
                (row._issues || [row._action]).forEach(issue => {
                    if (issue === 'Matching — No Action Required' || issue === 'Bulk Location — Excluded') return;
                    if (!groups[issue]) groups[issue] = [];
                    const exportRow = {};
                    [...COLUMNS, 'Storage Type', 'Zone', 'Aisle', 'Level', 'Capacity'].forEach(col => {
                        exportRow[col] = row[col];
                    });
                    exportRow['Primary Action'] = row._action;
                    exportRow['Validation Flag'] = issue;
                    exportRow['All Validation Flags'] = (row._issues || []).join(' • ');
                    groups[issue].push(exportRow);
                });
            });

            const usedNames = new Set();
            Object.entries(groups).forEach(([actionName, rows]) => {
                const ws = XLSX.utils.json_to_sheet(rows);
                XLSX.utils.book_append_sheet(wb, ws, getSafeSheetName(actionName, usedNames));
            });
            XLSX.writeFile(wb, 'WMS_Issues_Report.xlsx');
        }
        window.exportAllIssuesToExcel = exportAllIssuesToExcel;

        function handleFileUpload(file, type) {
            if (!file) return;
            state.loading = true;
            state.errorMsg = '';
            render();
            const fileName = file.name.toLowerCase();
            const isExcel = fileName.endsWith('.xlsx') || fileName.endsWith('.xls') || fileName.endsWith('.xlsb');
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    let csvText = '';
                    if (isExcel) {
                        const data = new Uint8Array(e.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        const firstSheet = workbook.SheetNames[0];
                        csvText = XLSX.utils.sheet_to_csv(workbook.Sheets[firstSheet]);
                    } else {
                        csvText = e.target.result;
                    }
                    Papa.parse(csvText, {
                        header: true,
                        skipEmptyLines: 'greedy',
                        transformHeader: function(h) {
                            return h ? h.replace(/^\uFEFF/, '').trim() : '';
                        },
                        complete: (results) => {
                            state.loading = false;
                            
                            const validData = results.data.filter(row => {
                                return Object.values(row).some(v => v !== null && v !== undefined && String(v).trim() !== '');
                            });
                            if (results.errors.length > 0 && validData.length === 0) {
                                state.errorMsg = "Unparseable or entirely empty file detected.";
                                render();
                                return;
                            }
                            
                            if (type === 'SOH') {
                                if (validData.length === 0) {
                                    state.errorMsg = "No valid inventory data rows found in SOH file.";
                                } else {
                                    state.sohData = validData;
                                    const firstRow = validData[0] || {};
                                    state.columnMapping = mapColumns(Object.keys(firstRow));
                                    state.errorMsg = '';
                                }
                            } else {
                                state.locData = validData;
                                state.errorMsg = '';
                            }
                            
                            if (state.isInitialized && state.sohData.length > 0) {
                                initializeBulkExclusions();
                                processDataPipeline();
                            }
                            render();
                        },
                        error: (err) => {
                            state.loading = false;
                            state.errorMsg = "CSV parsing error: " + err.message;
                            render();
                        }
                    });
                } catch (err) {
                    state.loading = false;
                    state.errorMsg = "File processing failure: " + err.message;
                    render();
                }
            };
            if (isExcel) {
                reader.readAsArrayBuffer(file);
            } else {
                reader.readAsText(file);
            }
        }

        function processGoogleSheetCSV(text) {
            Papa.parse(text, {
                header: true,
                skipEmptyLines: 'greedy',
                transformHeader: function(h) {
                    return h ? h.replace(/^\uFEFF/, '').trim() : '';
                },
                complete: (results) => {
                    state.loading = false;
                    const validData = results.data.filter(row => {
                        return Object.values(row).some(v => v !== null && v !== undefined && String(v).trim() !== '');
                    });
                    if (validData.length === 0) {
                        state.errorMsg = "No valid records extracted from Google Sheet.";
                        render();
                        return;
                    }
                    state.sohData = validData;
                    const firstRow = validData[0] || {};
                    state.columnMapping = mapColumns(Object.keys(firstRow));
                    state.errorMsg = '';
                    
                    if (!state.isInitialized) {
                        state.isInitialized = true;
                    }
                    initializeBulkExclusions();
                    processDataPipeline();
                    render();
                }
            });
        }

        function processDataPipeline() {
            if (!state.sohData || state.sohData.length === 0) return;

            const mapKey = (row, key) => {
                const userHeader = state.columnMapping[key];
                return userHeader && row[userHeader] !== null && row[userHeader] !== undefined ? String(row[userHeader]).trim() : '';
            };
            const hasSohColumn = (key) => Boolean(state.columnMapping[key]);
            const hasLocationMaster = Boolean(state.locData && state.locData.length > 0);
            const locationKey = (org, loc) => buildLocationKey(org, loc);

            const locMapByOrg = new Map();
            const locMapFallback = new Map();
            const activeStorageTypesSet = new Set();
            const orgsSet = new Set();
            const zonesSet = new Set(['Unassigned']);
            let storageKeyLoc = null;
            let locKeyLoc = null;
            let zoneKeyLoc = null;
            let whKeyLoc = null;
            let capacityKeyLoc = null;

            state.locationMetrics = {
                available: { total: 0, categories: {} },
                used: { total: 0, categories: {} }
            };

            if (hasLocationMaster) {
                const headers = Object.keys(state.locData[0]);
                storageKeyLoc = findColByAliases(headers, STOR_COL_ALIASES);
                locKeyLoc     = findColByAliases(headers, LOC_COL_ALIASES);
                zoneKeyLoc    = findColByAliases(headers, ZONE_COL_ALIASES);
                whKeyLoc      = findColByAliases(headers, ORG_COL_ALIASES);
                capacityKeyLoc = findColByAliases(headers, CAPACITY_COL_ALIASES);

                state.locData.forEach(locRow => {
                    const locRaw = getFirstNonBlankValue(locRow, ['Location', 'Locator'], locKeyLoc);
                    if (!locRaw) return;

                    const locKey = toLocationKey(locRaw);
                    const masterOrg = getFirstNonBlankValue(locRow, ['Warehouse Name', 'Warehouse', 'Org Code'], whKeyLoc);
                    const rawStorageVal = getFirstNonBlankValue(locRow, ['Storage', 'Storage Type'], storageKeyLoc);
                    const category = determineStorageCategory(rawStorageVal);

                    locMapFallback.set(locKey, locRow);
                    if (masterOrg) locMapByOrg.set(locationKey(masterOrg, locRaw), locRow);
                    activeStorageTypesSet.add(category);

                    const rawZoneVal = getFirstNonBlankValue(locRow, ['Zone Name', 'Zone'], zoneKeyLoc);
                    if (rawZoneVal) {
                        const lowerZone = rawZoneVal.toLowerCase();
                        if (!state.zoneMapping.has(lowerZone)) state.zoneMapping.set(lowerZone, rawZoneVal);
                        zonesSet.add(state.zoneMapping.get(lowerZone));
                    }
                    if (masterOrg) orgsSet.add(masterOrg);
                });
            }

            const locStats = new Map();
            const lpnStats = new Map();
            const batchExpiryStats = new Map();
            const duplicateRecordCounts = new Map();
            const divisionsSet = new Set();

            const makeLocStats = () => ({
                items: new Set(), lpns: new Set(), exps: new Set(), batches: new Set(),
                divisions: new Set(), subinvs: new Set(), rows: []
            });
            const makeLpnStats = () => ({ items: new Set(), lots: new Set(), exps: new Set(), locations: new Set() });
            const startOfToday = new Date();
            startOfToday.setHours(0, 0, 0, 0);

            state.sohData.forEach(row => {
                const loc = mapKey(row, 'Locator') || 'UNKNOWN';
                if (isBulkLocator(loc)) return;

                const orgRaw = mapKey(row, 'Org Code');
                const org = orgRaw || 'UNKNOWN';
                const divisionRaw = mapKey(row, 'Division');
                const division = divisionRaw || 'Unassigned';
                const lpn = mapKey(row, 'LPN NO');
                const item = mapKey(row, 'Item Code');
                const exp = mapKey(row, 'EXP Date');
                const supplierLot = mapKey(row, 'Supplier LOT');
                const lotNum = mapKey(row, 'LOT NUM');
                const marsBatch = mapKey(row, 'Mars Batch');
                const batchKey = supplierLot || lotNum || marsBatch;
                const subinv = mapKey(row, 'Subinv');
                const locGroupKey = locationKey(org, loc);
                const lpnGroupKey = lpn ? buildCompositeKey(org, lpn) : '';

                orgsSet.add(org);
                divisionsSet.add(division);

                if (!locStats.has(locGroupKey)) locStats.set(locGroupKey, makeLocStats());
                const stats = locStats.get(locGroupKey);
                if (item) stats.items.add(toMatchKey(item));
                if (lpn) stats.lpns.add(toMatchKey(lpn));
                if (exp) stats.exps.add(String(exp).trim());
                if (batchKey) stats.batches.add(toMatchKey(batchKey));
                if (divisionRaw) stats.divisions.add(toMatchKey(divisionRaw));
                if (subinv) stats.subinvs.add(toMatchKey(subinv));
                stats.rows.push(row);

                if (lpnGroupKey) {
                    if (!lpnStats.has(lpnGroupKey)) lpnStats.set(lpnGroupKey, makeLpnStats());
                    const lpnGroup = lpnStats.get(lpnGroupKey);
                    if (item) lpnGroup.items.add(toMatchKey(item));
                    if (batchKey) lpnGroup.lots.add(toMatchKey(batchKey));
                    if (exp) lpnGroup.exps.add(String(exp).trim());
                    lpnGroup.locations.add(toLocationKey(loc));
                }

                if (batchKey && item && divisionRaw) {
                    const batchGroupKey = buildCompositeKey(org, divisionRaw, item, batchKey);
                    if (!batchExpiryStats.has(batchGroupKey)) batchExpiryStats.set(batchGroupKey, new Set());
                    if (exp) batchExpiryStats.get(batchGroupKey).add(String(exp).trim());
                }

                const duplicateRecordKey = buildInventoryRecordKey(
                    orgRaw, divisionRaw, loc, lpn, item, batchKey, exp,
                    String(coerceFloat(mapKey(row, 'PUOM QTY'))), String(coerceFloat(mapKey(row, 'CS QTY')))
                );
                duplicateRecordCounts.set(duplicateRecordKey, (duplicateRecordCounts.get(duplicateRecordKey) || 0) + 1);
            });

            const processed = [];
            const actionCounts = {};
            const flagsCount = blankFlagCounts();

            state.sohData.forEach((row, idx) => {
                const rawOrg = mapKey(row, 'Org Code');
                const org = rawOrg || 'UNKNOWN';
                const rawDivision = mapKey(row, 'Division');
                const division = rawDivision || 'Unassigned';
                const rawLocator = mapKey(row, 'Locator');
                const loc = rawLocator || 'UNKNOWN';
                const item = mapKey(row, 'Item Code');
                const lpn = mapKey(row, 'LPN NO');
                const subinv = mapKey(row, 'Subinv');
                const subinvUpper = String(subinv || '').trim().toUpperCase();
                const supplierLot = mapKey(row, 'Supplier LOT');
                const lotNum = mapKey(row, 'LOT NUM');
                const marsBatch = mapKey(row, 'Mars Batch');
                const batchKey = supplierLot || lotNum || marsBatch;
                const expRaw = mapKey(row, 'EXP Date');
                const expDateObj = parseRobustDate(expRaw);
                const puomQtyRaw = mapKey(row, 'PUOM QTY');
                const csQtyRaw = mapKey(row, 'CS QTY');
                const puomQty = coerceFloat(puomQtyRaw);
                const csQty = coerceFloat(csQtyRaw);
                const locGroupKey = locationKey(org, loc);
                const lpnGroupKey = lpn ? buildCompositeKey(org, lpn) : '';
                const stats = locStats.get(locGroupKey) || makeLocStats();
                const lpnGroup = lpnGroupKey ? (lpnStats.get(lpnGroupKey) || makeLpnStats()) : makeLpnStats();

                const locKey = toLocationKey(loc);
                const exactMasterLoc = locMapByOrg.get(locationKey(org, loc));
                const fallbackMasterLoc = locMapFallback.get(locKey);
                const masterLoc = exactMasterLoc || fallbackMasterLoc || null;
                const masterFound = Boolean(masterLoc);
                const masterOrg = masterLoc ? getFirstNonBlankValue(masterLoc, ['Warehouse Name', 'Warehouse', 'Org Code'], whKeyLoc) : '';
                const rawStorageType = masterLoc
                    ? (getFirstNonBlankValue(masterLoc, ['Storage', 'Storage Type'], storageKeyLoc) || 'Unspecified')
                    : parseStorageTypeFromLocator(loc);
                const stTypeString = String(rawStorageType || '').trim();
                const storageCategory = determineStorageCategory(stTypeString);
                activeStorageTypesSet.add(storageCategory);

                const rawZone = masterLoc ? getFirstNonBlankValue(masterLoc, ['Zone Name', 'Zone'], zoneKeyLoc) : '';
                const zone = rawZone ? (state.zoneMapping.get(rawZone.toLowerCase()) || rawZone) : 'Unassigned';
                const coords = parseAisleLevelFromLocator(loc);
                const rawLevel = masterLoc ? getFirstNonBlankValue(masterLoc, ['Level', 'level']) : '';
                const level = String(rawLevel || coords.level).trim().padStart(2, '0');

                const rawCapacity = masterLoc ? getFirstNonBlankValue(masterLoc, ['Capacity', 'Tunnel Capacity'], capacityKeyLoc) : '';
                const parsedCapacity = rawCapacity === '' ? NaN : Number(String(rawCapacity).replace(/,/g, ''));
                let capacity = 1;
                if (Number.isFinite(parsedCapacity) && parsedCapacity > 0) capacity = Math.floor(parsedCapacity);
                else if (storageCategory === 'Radio Shuttle') capacity = 10;

                const isStandardStorage = ['Normal Physical Storage', 'Radio Shuttle', 'Bins', 'Shelves', 'POS'].includes(storageCategory);
                const isNonShuttleStandard = ['Normal Physical Storage', 'Bins', 'Shelves', 'POS'].includes(storageCategory);
                const isBulkExcluded = isBulkLocator(loc);
                const isTracking = isTrackingStorageType(stTypeString);
                const isExplicitNonSellable = isExplicitNonSellableStorage(stTypeString, loc);
                const isUnsellableSubinventory = subinvUpper !== '' && subinvUpper !== 'SELLABLE';
                const isUnmappedStorage = masterFound && !isApprovedStorageType(stTypeString) && !isExplicitNonSellable;
                const isMissingMasterLocation = hasLocationMaster && !masterFound;
                const isOrgMismatch = masterFound && Boolean(masterOrg) && Boolean(rawOrg) && toMatchKey(masterOrg) !== toMatchKey(rawOrg);
                const isInvalidCapacity = masterFound && isStandardStorage && (
                    storageCategory === 'Radio Shuttle'
                        ? (!Number.isFinite(parsedCapacity) || parsedCapacity <= 0)
                        : (rawCapacity !== '' && (!Number.isFinite(parsedCapacity) || parsedCapacity <= 0))
                );
                const isOvercapacity = isStandardStorage && stats.lpns.size > capacity;
                const isMultiItem = isStandardStorage && stats.items.size > 1;
                const isMultiLpn = isNonShuttleStandard && stats.lpns.size > 1;
                const isSingleLpnShuttle = storageCategory === 'Radio Shuttle' && stats.lpns.size === 1;
                const isMultiExp = isStandardStorage && stats.exps.size > 1;
                const isMultiBatch = isStandardStorage && stats.batches.size > 1;
                const isMultiDivision = isStandardStorage && stats.divisions.size > 1;
                const isMultiSubinventory = isStandardStorage && stats.subinvs.size > 1;
                const isLpnDuplicate = lpnGroup.locations.size > 1;
                const isLpnMultiSku = lpnGroup.items.size > 1;
                const isLpnMultiLotExpiry = lpnGroup.lots.size > 1 || lpnGroup.exps.size > 1;
                const batchGroupKey = (batchKey && item && rawDivision) ? buildCompositeKey(org, rawDivision, item, batchKey) : '';
                const isBatchExpiryConflict = batchGroupKey && (batchExpiryStats.get(batchGroupKey) || new Set()).size > 1;
                const duplicateRecordKey = buildInventoryRecordKey(rawOrg, rawDivision, loc, lpn, item, batchKey, expRaw, String(puomQty), String(csQty));
                const isDuplicateRecord = (duplicateRecordCounts.get(duplicateRecordKey) || 0) > 1;
                const hasMissingMandatory = !rawOrg || !rawDivision || !rawLocator || !item || !lpn ||
                    (!hasSohColumn('PUOM QTY') && !hasSohColumn('CS QTY')) ||
                    (hasSohColumn('PUOM QTY') && puomQtyRaw === '') ||
                    (hasSohColumn('CS QTY') && csQtyRaw === '');
                // Quantity integrity is based only on the primary on-hand quantity column.
                // CS QTY may legitimately be zero for conversion / UOM scenarios and is not used here.
                const hasZeroOrNegativeQty =
                    hasSohColumn('PUOM QTY') && puomQtyRaw !== '' && puomQty <= 0;
                const hasStatusConflict = subinvUpper === 'SELLABLE' && (
                    isBlockingInventoryStatus(mapKey(row, 'LOT STATUS')) ||
                    isBlockingInventoryStatus(mapKey(row, 'LPN STATUS')) ||
                    isBlockingInventoryStatus(mapKey(row, 'Batch Status'))
                );
                const isExpiredSellable = subinvUpper === 'SELLABLE' && expDateObj && expDateObj < startOfToday;

                let issues = [];
                let actionLabel = 'Matching — No Action Required';
                if (isBulkExcluded) {
                    actionLabel = 'Bulk Location — Excluded';
                    issues = [actionLabel];
                } else if (isUnsellableSubinventory || (isExplicitNonSellable && !isTracking)) {
                    actionLabel = 'Unsellable / Dummy';
                    issues = [actionLabel];
                } else if (isTracking) {
                    actionLabel = 'Tracking — Verify & Action';
                    issues = [actionLabel];
                } else {
                    if (hasMissingMandatory) issues.push('Missing Mandatory Inventory Data');
                    if (isMissingMasterLocation) issues.push('Location Missing from Master');
                    if (isOrgMismatch) issues.push('Org Mismatch with Location Master');
                    if (isUnmappedStorage) issues.push('Unmapped Storage Type / Classification');
                    if (hasStatusConflict) issues.push('Status Conflict — Sellable Stock');
                    if (isExpiredSellable) issues.push('Expired Sellable Stock');
                    if (isLpnDuplicate) issues.push('LPN Duplication Alert');
                    if (isLpnMultiSku) issues.push('Same LPN — Multiple SKUs');
                    if (isLpnMultiLotExpiry) issues.push('Same LPN — Multiple Lots / Expiry');
                    if (isBatchExpiryConflict) issues.push('Same Batch — Different Expiry');
                    if (isDuplicateRecord) issues.push('Duplicate Inventory Record');
                    if (isOvercapacity) issues.push('Overcapacity — Locator Overfilled');
                    if (isMultiDivision) issues.push('Multiple Divisions in Location');
                    if (isMultiSubinventory) issues.push('Multiple Subinventories in Location');
                    if (isMultiItem) issues.push('Multiple Items in Location');
                    if (isMultiExp) issues.push('Multiple Expiry Dates in Location');
                    if (isMultiLpn) issues.push('Multiple LPNs in Location');
                    if (isMultiBatch) issues.push('Multiple Batches in Location');
                    if (isInvalidCapacity) issues.push('Missing / Invalid Location Capacity');
                    if (hasZeroOrNegativeQty) issues.push('Zero / Negative Inventory Quantity');
                    if (isSingleLpnShuttle) issues.push('Single LPN in Shuttle');

                    if (issues.length > 0) {
                        actionLabel = ACTION_PRIORITY.find(action => issues.includes(action)) || issues[0];
                    } else {
                        issues = ['Matching — No Action Required'];
                    }
                }

                const actionColor = getActionColor(actionLabel);
                issues.forEach(issue => {
                    const flagKey = ACTION_META[issue] && ACTION_META[issue].flagKey;
                    if (flagKey && Object.prototype.hasOwnProperty.call(flagsCount, flagKey)) flagsCount[flagKey]++;
                });
                actionCounts[actionLabel] = (actionCounts[actionLabel] || 0) + 1;

                processed.push({
                    _id: idx,
                    'Org Code': org,
                    'Division': division,
                    'Supplier': mapKey(row, 'Supplier') || 'UNKNOWN',
                    'Item Category': mapKey(row, 'Item Category') || 'UNKNOWN',
                    'Item Code': item || 'UNKNOWN',
                    'Description': mapKey(row, 'Description') || 'UNKNOWN',
                    'PACK': mapKey(row, 'PACK') || 'UNKNOWN',
                    'Subinv': subinv || 'UNKNOWN',
                    'Locator': loc,
                    'LOC STATUS': mapKey(row, 'LOC STATUS') || '',
                    'LOT NUM': lotNum || '',
                    'LOT STATUS': mapKey(row, 'LOT STATUS') || '',
                    'LPN NO': lpn || '',
                    'LPN STATUS': mapKey(row, 'LPN STATUS') || '',
                    'EXP Date': expRaw || '',
                    'PUOM': mapKey(row, 'PUOM') || 'CS',
                    'PUOM QTY': puomQty,
                    'CS QTY': csQty,
                    'PUOM CST': coerceFloat(mapKey(row, 'PUOM CST')),
                    'Source Type': mapKey(row, 'Source Type') || '',
                    'Source No': mapKey(row, 'Source No') || '',
                    'Supplier LOT': supplierLot || '',
                    'Mars Batch': marsBatch || '',
                    'Batch Status': mapKey(row, 'Batch Status') || '',
                    'Cross Ref.': mapKey(row, 'Cross Ref.') || '',
                    'Storage Type': stTypeString,
                    '_storageCategory': storageCategory,
                    'Zone': zone,
                    'Aisle': coords.aisle,
                    'Level': level,
                    'Capacity': capacity,
                    '_stats': {
                        items: stats.items.size, lpns: stats.lpns.size, exps: stats.exps.size,
                        batches: stats.batches.size, divisions: stats.divisions.size, subinvs: stats.subinvs.size
                    },
                    '_issues': issues,
                    '_issueSummary': issues.join(' • '),
                    '_action': actionLabel,
                    '_color': actionColor,
                    '_expDateObj': expDateObj,
                    '_locMasterFound': masterFound,
                    '_locMasterOrg': masterOrg
                });
            });

            state.uniqueOrgs = Array.from(orgsSet).filter(Boolean).sort();
            state.uniqueDivisions = Array.from(divisionsSet).filter(Boolean).sort();
            state.uniqueZones = Array.from(zonesSet).filter(Boolean).sort();
            state.uniqueStorageTypes = Array.from(activeStorageTypesSet)
                .filter(Boolean)
                .sort((a, b) => {
                    const ia = APPROVED_STORAGE_CLASSES.indexOf(a);
                    const ib = APPROVED_STORAGE_CLASSES.indexOf(b);
                    return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
                });

            state.processedData = processed;
            state.actionSummary = ACTION_LABELS.map(key => ({
                name: key,
                value: actionCounts[key] || 0,
                color: getActionColor(key)
            }));
            state.kpis = {
                totalRows: processed.length,
                flagsCount,
                excludedCount: processed.filter(r => r._action === 'Bulk Location — Excluded').length
            };

            const syncFilter = (uniqueList, filterList) => {
                uniqueList.forEach(val => {
                    if (!filterList.includes(val)) filterList.push(val);
                });
            };
            syncFilter(state.uniqueOrgs, state.filters.orgCodes);
            syncFilter(state.uniqueDivisions, state.filters.divisions);
            syncFilter(state.uniqueZones, state.filters.zones);
            syncFilter(state.uniqueStorageTypes, state.filters.storageTypes);
            syncFilter(ACTION_LABELS, state.filters.actions);
        }

        function getGloballyFilteredData() {
            if (state.filters.orgCodes.length === 0) return [];
            if (state.filters.divisions.length === 0) return [];
            if (state.filters.storageTypes.length === 0) return [];
            if (state.filters.zones.length === 0) return [];
            
            return state.processedData.filter(row => {
                if (!state.filters.orgCodes.includes(row['Org Code'])) return false;
                if (!state.filters.divisions.includes(row['Division'])) return false;
                if (!state.filters.storageTypes.includes(row._storageCategory)) return false;
                if (!state.filters.zones.includes(row['Zone'])) return false;
                
                if (state.filters.search) {
                    const searchTerms = state.filters.search.toLowerCase().split(',').map(s => s.trim()).filter(Boolean);
                    if (searchTerms.length > 0) {
                        const rowLoc = String(row['Locator']||'').toLowerCase();
                        const rowItem = String(row['Item Code']||'').toLowerCase();
                        const rowLpn = String(row['LPN NO']||'').toLowerCase();
                        const rowDesc = String(row['Description']||'').toLowerCase();
                        
                        const matchesAny = searchTerms.some(s => 
                            rowLoc.includes(s) || rowItem.includes(s) || rowLpn.includes(s) || rowDesc.includes(s)
                        );
                        if (!matchesAny) return false;
                    }
                }
                return true;
            });
        }

        function getFilteredData() {
            const globalFilter = getGloballyFilteredData();
            return globalFilter.filter(row => {
                const rowIssues = Array.isArray(row._issues) ? row._issues : [row._action];
                if (state.filters.actions.length > 0 && !rowIssues.some(issue => state.filters.actions.includes(issue))) return false;
                for (const col in state.filters.headerFilters) {
                    const selectedVals = state.filters.headerFilters[col];
                    if (selectedVals && selectedVals.length > 0) {
                        if (col === '_action') {
                            if (!rowIssues.some(issue => selectedVals.includes(issue))) return false;
                        } else {
                            const val = String(row[col] || '').trim();
                            if (!selectedVals.includes(val)) return false;
                        }
                    }
                }
                return true;
            });
        }

        function toggleDivisionFilter(div) {
            if (state.filters.divisions.includes(div)) {
                state.filters.divisions = state.filters.divisions.filter(d => d !== div);
            } else {
                state.filters.divisions.push(div);
            }
            state.currentPage = 1;
            updateTableAndCharts();
        }
        window.toggleDivisionFilter = toggleDivisionFilter;

        function toggleStorageTypeSlicer(typeLabel) {
            if (state.filters.storageTypes.includes(typeLabel)) {
                state.filters.storageTypes = state.filters.storageTypes.filter(t => t !== typeLabel);
            } else {
                state.filters.storageTypes.push(typeLabel);
            }
            state.currentPage = 1;
            updateTableAndCharts();
        }
        window.toggleStorageTypeSlicer = toggleStorageTypeSlicer;

        function toggleZoneFilter(zone) {
            if (state.filters.zones.includes(zone)) {
                state.filters.zones = state.filters.zones.filter(z => z !== zone);
            } else {
                state.filters.zones.push(zone);
            }
            state.currentPage = 1;
            updateTableAndCharts();
        }

                                                        <div class="mb-2">
                                                            <input type="text" placeholder="Type to search..." oninput="filterHeaderChecklist(event, 'EXP Date')" class="w-full bg-slate-900 border border-slate-800 rounded px-2 py-1 text-xs text-white focus:outline-none" />
                                                        </div>
                                                        <div id="checklist-EXP Date" class="space-y-1.5 max-h-40 overflow-y-auto custom-scrollbar font-mono text-[11px]">

                                    <div id="table-pagination-controls" class="flex-1 w-full flex flex-col sm:flex-row justify-between items-center gap-4">
                                    </div>
                                    <div class="shrink-0 flex flex-wrap items-center justify-end w-full sm:w-auto mt-4 sm:mt-0 border-t sm:border-t-0 border-slate-800 pt-4 sm:pt-0 gap-2">
                                        <button onclick="exportFilteredGrid()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold rounded shadow transition flex items-center gap-2 w-full sm:w-auto justify-center font-mono">
                                            ${getSVGIcon('download', 'w-4 h-4')} Export Filtered Grid
                                        </button>
                                        <button onclick="exportAllIssuesToExcel()" class="px-4 py-2 bg-cyan-600 hover:bg-cyan-500 text-slate-950 font-bold rounded shadow transition flex items-center gap-2 w-full sm:w-auto justify-center font-mono">
                                            ${getSVGIcon('file-spreadsheet', 'w-4 h-4')} Export All Issues
                                        </button>

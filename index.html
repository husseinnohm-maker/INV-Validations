                            </div>
                        </div>
                    </main>
                </div>
            `;
        }

        function initLandingEvents() {
            document.getElementById('btn-fetch-demo').addEventListener('click', () => {
                handleLoadSimulatedData();
            });
            document.getElementById('input-soh-file').addEventListener('change', (e) => {
                if (e.target.files && e.target.files[0]) {
                    handleFileUpload(e.target.files[0], 'SOH');
                    e.target.value = ''; 
                }
            });
            document.getElementById('input-loc-file').addEventListener('change', (e) => {
                if (e.target.files && e.target.files[0]) {
                    handleFileUpload(e.target.files[0], 'LOC');
                    e.target.value = ''; 
                }
            });
            document.getElementById('btn-toggle-google').addEventListener('click', () => {
                state.showGoogleInput = !state.showGoogleInput;
                render();
            });
            document.getElementById('btn-fetch-google').addEventListener('click', () => {
                state.googleSheetUrl = document.getElementById('google-sheet-url').value;
                handleGoogleSheetsFetch();
            });
            document.getElementById('btn-launch-console').addEventListener('click', () => {
                if (state.sohData.length > 0) {
                    initializeBulkExclusions();
                    processDataPipeline();
                    state.isInitialized = true;
                    render();
                }
            });
        }

        function initDashboardEvents() {
            document.getElementById('btn-disconnect').addEventListener('click', () => {
                state.isInitialized = false;
                state.sohData = [];
                state.locData = [];
                state.columnMapping = {};
                state.filters.headerFilters = {
                    _action: [],
                    Locator: [],
                    'Storage Type': [],
                    'Item Code': [],
                    'LPN NO': [],
                    'EXP Date': [],
                    Division: []
                };
                render();
            });
            document.getElementById('input-swap-soh').addEventListener('change', (e) => {
                if (e.target.files && e.target.files[0]) {
                    handleFileUpload(e.target.files[0], 'SOH');
                    e.target.value = ''; 
                }
            });
            document.getElementById('input-swap-loc').addEventListener('change', (e) => {
                if (e.target.files && e.target.files[0]) {
                    handleFileUpload(e.target.files[0], 'LOC');
                    e.target.value = ''; 
                }
            });
            const searchInput = document.getElementById('search-input');
            if (searchInput) {
                searchInput.addEventListener('input', (e) => {
                    state.filters.search = e.target.value;
                    state.currentPage = 1; 
                    updateTableAndCharts();
                });
            }
        }

        function addBulkLocatorFromUI() {
            const input = document.getElementById('bulk-locator-input');
            if (!input) return;
            const value = input.value.trim().toUpperCase();
            if (value && !state.bulkLocations.includes(value)) {
                state.bulkLocations.push(value);
                syncBulkExclusionLedgerFromVisibleRules();
                state.currentPage = 1;
                input.value = '';
                processDataPipeline();
                render();
            }
        }
        window.addBulkLocatorFromUI = addBulkLocatorFromUI;

        function removeBulkLocator(loc) {
            state.bulkLocations = state.bulkLocations.filter(b => b !== loc);
            syncBulkExclusionLedgerFromVisibleRules();
            state.currentPage = 1;
            processDataPipeline();
            render();
        }
        window.removeBulkLocator = removeBulkLocator;

        function toggleOrgFilter(org) {
            if (state.filters.orgCodes.includes(org)) {
                state.filters.orgCodes = state.filters.orgCodes.filter(o => o !== org);
            } else {
                state.filters.orgCodes.push(org);
            }
            state.currentPage = 1;
            updateTableAndCharts();
        }
        window.toggleOrgFilter = toggleOrgFilter;

        function toggleHeaderDropdown(event, colKey) {
            event.stopPropagation();
            const targetId = `filter-dropdown-${colKey}`;
            const activeDropdownEl = document.getElementById(targetId);
            if (state.activeDropdown && state.activeDropdown !== activeDropdownEl) {
                state.activeDropdown.classList.remove('show');
            }
            if (activeDropdownEl) {
                activeDropdownEl.classList.toggle('show');
                state.activeDropdown = activeDropdownEl.classList.contains('show') ? activeDropdownEl : null;
            }
        }
        window.toggleHeaderDropdown = toggleHeaderDropdown;

        function syncHeaderFilters() {
            const cols = ['_action', 'Locator', 'Storage Type', 'Item Code', 'LPN NO', 'EXP Date', 'Division'];
            cols.forEach(col => {
                const dropdown = document.getElementById(`filter-dropdown-${col}`);
                if (dropdown) {
                    const checkedCheckboxes = dropdown.querySelectorAll('input[type="checkbox"]:checked');
                    state.filters.headerFilters[col] = Array.from(checkedCheckboxes).map(cb => cb.value);
                }
            });
            state.currentPage = 1;
            updateTableAndCharts();
        }
        window.syncHeaderFilters = syncHeaderFilters;

        function toggleHeaderFilterVal(colKey, val) {
            if (!state.filters.headerFilters[colKey]) {
                state.filters.headerFilters[colKey] = [];
            }
            const arr = state.filters.headerFilters[colKey];
            const index = arr.indexOf(val);
            if (index > -1) {
                arr.splice(index, 1);
            } else {
                arr.push(val);
            }
            
            const dropdown = document.getElementById(`filter-dropdown-${colKey}`);
            if (dropdown) {
                const checkboxes = dropdown.querySelectorAll('input[type="checkbox"]');
                checkboxes.forEach(cb => {
                    if (cb.value === val) {
                        cb.checked = (index === -1);
                    }
                });
            }
            state.currentPage = 1;
            updateTableAndCharts();
        }
        window.toggleHeaderFilterVal = toggleHeaderFilterVal;


        function filterToIssue(actionName) {
            state.filters.headerFilters._action = [actionName];
            const dropdown = document.getElementById('filter-dropdown-_action');
            if (dropdown) {
                dropdown.querySelectorAll('input[type="checkbox"]').forEach(cb => {
                    cb.checked = cb.value === actionName;
                });
            }
            state.currentPage = 1;
            updateTableAndCharts();
        }
        window.filterToIssue = filterToIssue;

        function clearHeaderFilter(event, colKey) {
            event.stopPropagation();
            state.filters.headerFilters[colKey] = [];
            
            const dropdown = document.getElementById(`filter-dropdown-${colKey}`);
            if (dropdown) {
                dropdown.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = false);
            }
            updateTableAndCharts();
        }
        window.clearHeaderFilter = clearHeaderFilter;

        function closeActiveDropdown(event) {
            if (event) event.stopPropagation();
            if (state.activeDropdown) {
                state.activeDropdown.classList.remove('show');
                state.activeDropdown = null;
            }
        }
        window.closeActiveDropdown = closeActiveDropdown;

        function filterHeaderChecklist(event, colKey) {
            const query = event.target.value.toLowerCase().trim();
            const container = document.getElementById(`checklist-${colKey}`);
            if (!container) return;
            const labels = container.querySelectorAll('label');
            labels.forEach(label => {
                const text = label.textContent.toLowerCase();
                if (text.includes(query)) {
                    label.classList.remove('hidden');
                } else {
                    label.classList.add('hidden');
                }
            });
        }
        window.filterHeaderChecklist = filterHeaderChecklist;

        function changePage(direction) {
            const filtered = getFilteredData();
            const totalFiltered = filtered.length;
            const totalPages = Math.ceil(totalFiltered / state.pageSize) || 1;
            
            if (direction === 'prev') {
                state.currentPage = Math.max(1, state.currentPage - 1);
            } else if (direction === 'next') {
                state.currentPage = Math.min(totalPages, state.currentPage + 1);
            } else if (direction === 'first') {
                state.currentPage = 1;
            } else if (direction === 'last') {
                state.currentPage = totalPages;
            }
            updateTableAndCharts();
        }
        window.changePage = changePage;

        function changePageSize(size) {
            state.pageSize = parseInt(size, 10);
            state.currentPage = 1;
            updateTableAndCharts();
        }
        window.changePageSize = changePageSize;

        document.addEventListener('click', (e) => {
            if (state.activeDropdown && !state.activeDropdown.contains(e.target)) {
                closeActiveDropdown();
            }
        });

        const setTxt = (id, txt) => { 
            const el = document.getElementById(id); 
            if (el) el.innerHTML = txt; 
        };

        function updateTableAndCharts() {
            const globallyFiltered = getGloballyFilteredData();
            const filtered = getFilteredData();
            
            const tbody = document.getElementById('tbody-grid-stream');
            if (tbody) {
                const totalFiltered = filtered.length;
                const totalPages = Math.ceil(totalFiltered / state.pageSize) || 1;
                if (state.currentPage > totalPages) state.currentPage = totalPages;
                if (state.currentPage < 1) state.currentPage = 1;
                const pageData = filtered.slice((state.currentPage - 1) * state.pageSize, state.currentPage * state.pageSize);
                tbody.innerHTML = pageData.map(row => `
                    <tr class="hover:bg-slate-800/40 transition-colors animate-fadeIn font-mono text-xs">
                        <td class="p-3 min-w-[260px]">
                            <div class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[11px] font-bold border"
                                 style="background-color: ${row._color}15; border-color: ${row._color}30; color: ${row._color}">
                                <span class="w-1.5 h-1.5 rounded-full" style="background-color: ${row._color}"></span>
                                ${row._action}
                            </div>
                            ${(row._issues || []).filter(issue => issue !== row._action && issue !== 'Matching — No Action Required').length > 0 ? `
                                <div class="mt-1 text-[10px] leading-relaxed text-slate-400 max-w-[330px] whitespace-normal" title="${(row._issues || []).join(' • ')}">
                                    ${(row._issues || []).filter(issue => issue !== row._action && issue !== 'Matching — No Action Required').join(' • ')}
                                </div>
                            ` : ''}
                        </td>
                        <td class="p-3 text-slate-300 font-bold">${row['Locator'] || ''}</td>
                        <td class="p-3 text-slate-400">${row['Division'] || ''}</td>
                        <td class="p-3 text-slate-400">${row['Storage Type'] || ''}</td>
                        <td class="p-3 text-cyan-400 font-medium">${row['Item Code'] || ''}</td>
                        <td class="p-3 text-slate-400">${row['LPN NO'] || ''}</td>
                        <td class="p-3 text-slate-400">${row['EXP Date'] || ''}</td>
                        <td class="p-3 text-right text-slate-300">${row['PUOM'] || ''}</td>
                        <td class="p-3 text-right text-slate-300">${formatNumber(row['PUOM QTY'])}</td>
                        <td class="p-3 text-right font-medium text-white">${row['CS QTY'] || 0}</td>
                    </tr>
                `).join('');

                if (filtered.length === 0) {
                    tbody.innerHTML = `
                        <tr>
                            <td colSpan="10" class="p-8 text-center text-slate-500 font-mono">
                                ${getSVGIcon('search', 'mx-auto mb-2 opacity-50 w-8 h-8', '32')}
                                No records found matching current filters.
                            </td>
                        </tr>
                    `;
                }

                const paginationControls = document.getElementById('table-pagination-controls');
                if (paginationControls) {
                    const startIdx = totalFiltered === 0 ? 0 : (state.currentPage - 1) * state.pageSize + 1;
                    const endIdx = Math.min(state.currentPage * state.pageSize, totalFiltered);
                    
                    paginationControls.innerHTML = `
                        <div class="flex items-center gap-4">
                            <span class="text-slate-400">
                                Showing <span class="font-bold text-white font-mono">${startIdx}</span> to <span class="font-bold text-white font-mono">${endIdx}</span> of <span class="font-bold text-cyan-400 font-mono">${formatNumber(totalFiltered)}</span> records
                            </span>
                            <div class="flex items-center gap-1.5">
                                <span class="text-slate-500 font-mono">Page size:</span>
                                <select onchange="changePageSize(this.value)" class="bg-slate-950 border border-slate-800 rounded px-2 py-0.5 text-xs text-white focus:outline-none font-mono">
                                    <option value="50" ${state.pageSize === 50 ? 'selected' : ''}>50</option>
                                    <option value="150" ${state.pageSize === 150 ? 'selected' : ''}>150</option>
                                    <option value="500" ${state.pageSize === 500 ? 'selected' : ''}>500</option>
                                    <option value="1000" ${state.pageSize === 1000 ? 'selected' : ''}>1000</option>
                                </select>
                            </div>
                        </div>
                        <div class="flex items-center gap-1 font-mono">
                            <button onclick="changePage('first')" ${state.currentPage === 1 ? 'disabled' : ''} class="px-2 py-1 rounded bg-slate-800 hover:bg-slate-700 text-white disabled:opacity-30 disabled:hover:bg-slate-800 transition-colors">&lt;&lt;</button>
                            <button onclick="changePage('prev')" ${state.currentPage === 1 ? 'disabled' : ''} class="px-2 py-1 rounded bg-slate-800 hover:bg-slate-700 text-white disabled:opacity-30 disabled:hover:bg-slate-800 transition-colors">&lt; Prev</button>
                            <span class="px-3 py-1 bg-slate-950 border border-slate-800 rounded text-slate-300 font-mono">
                                Page <span class="text-white font-bold">${state.currentPage}</span> of <span class="text-slate-400">${totalPages}</span>
                            </span>
                            <button onclick="changePage('next')" ${state.currentPage === totalPages ? 'disabled' : ''} class="px-2 py-1 rounded bg-slate-800 hover:bg-slate-700 text-white disabled:opacity-30 disabled:hover:bg-slate-800 transition-colors">Next &gt;</button>
                            <button onclick="changePage('last')" ${state.currentPage === totalPages ? 'disabled' : ''} class="px-2 py-1 rounded bg-slate-800 hover:bg-slate-700 text-white disabled:opacity-30 disabled:hover:bg-slate-800 transition-colors">&gt;&gt;</button>
                        </div>
                    `;
                }
            }

            const recordBadge = document.getElementById('table-record-badge');
            if (recordBadge) {
                recordBadge.textContent = `Filtering ${formatNumber(filtered.length)} / ${formatNumber(state.kpis.totalRows || state.processedData.length)} records`;
            }

            const activeLocators = new Set();
            const activeLpns = new Set();
            const activeSkus = new Set();
            const excludedLocators = new Set();
            let exp30 = 0, exp90 = 0, level01Exp15 = 0, problemCount = 0;
            const now = new Date();
            const plus15 = new Date(); plus15.setDate(now.getDate() + 15);
            const plus30 = new Date(); plus30.setDate(now.getDate() + 30);
            const plus90 = new Date(); plus90.setDate(now.getDate() + 90);

            globallyFiltered.forEach(r => {
                if (r._action === "Bulk Location — Excluded") {
                    if (r['Locator']) excludedLocators.add(r['Locator']);
                } else {
                    if (r['Locator']) activeLocators.add(r['Locator']);
                    if (r['LPN NO']) activeLpns.add(r['LPN NO']);
                    if (r['Item Code']) activeSkus.add(r['Item Code']);
                    
                    if (r._expDateObj) {
                        if (r._expDateObj <= plus30) exp30++;
                        else if (r._expDateObj <= plus90) exp90++;
                        
                        const rowLevelClean = String(r.Level).trim().padStart(2, '0');
                        if (rowLevelClean === '01' && r._expDateObj <= plus15) {
                            level01Exp15++;
                        }
                    }
                    if (r._color !== COLORS.GREEN && r._color !== COLORS.GREY) {
                        problemCount++;
                    }
                }
            });

            const cleanPct = globallyFiltered.length > 0 ? (((globallyFiltered.length - problemCount) / globallyFiltered.length) * 100).toFixed(2) : "100.00";
            setTxt('kpi-locators', formatNumber(activeLocators.size));
            setTxt('kpi-lpns', `${formatNumber(activeLpns.size)} <span class="text-xs text-slate-500 font-mono font-bold">LPNs</span>`);
            setTxt('kpi-skus', `${formatNumber(activeSkus.size)} SKUs Registered`);
            setTxt('kpi-clean-pct', `${cleanPct}% Clean`);
            
            const cleanBar = document.getElementById('kpi-clean-bar');
            if (cleanBar) cleanBar.style.width = `${cleanPct}%`;
            setTxt('kpi-exp30', `${formatNumber(exp30)} <span class="text-xs text-slate-500 font-mono font-bold">≤30D</span>`);
            setTxt('kpi-exp90', `${formatNumber(exp90 + exp30)} ≤90 days expiry window`);
            const expGround = document.getElementById('kpi-exp-ground');
            if (expGround) {
                expGround.innerHTML = `${formatNumber(level01Exp15)} <span class="text-xs text-slate-500 font-mono">Pallets</span>`;
                expGround.className = level01Exp15 > 0 ? "text-2xl font-bold text-red-500 font-mono animate-pulse" : "text-2xl font-bold text-slate-300 font-mono";
            }
            
            const expPing = document.getElementById('kpi-exp-ping');
            if (expPing) {
                expPing.style.display = level01Exp15 > 0 ? 'block' : 'none';
            }

            const mixStoragePctCalculated = activeLocators.size > 0 ? ((globallyFiltered.filter(r => (r._issues || []).includes('Multiple Items in Location')).length / activeLocators.size) * 100).toFixed(1) : 0;
            const densityRatioCalculated = activeLocators.size > 0 ? (activeLpns.size / activeLocators.size).toFixed(2) : 0;
            const excludedEfficiencyCalculated = globallyFiltered.filter(r => r._action === "Bulk Location — Excluded").length;
            setTxt('diag-mix', `${mixStoragePctCalculated}%`);
            setTxt('diag-density', densityRatioCalculated);
            setTxt('diag-excl', formatNumber(excludedEfficiencyCalculated));

            const excludedLocatorsKpi = document.getElementById('kpi-excluded-locs');
            if (excludedLocatorsKpi) {
                excludedLocatorsKpi.textContent = `${formatNumber(excludedLocators.size)} locator record${excludedLocators.size !== 1 ? 's' : ''} excluded as bulk`;
            }

            let advisoryListHTML = '';
            if (state.kpis.flagsCount && globallyFiltered.length > 0) { 
                const fc = state.kpis.flagsCount;
                if (level01Exp15 > 0) {
                    advisoryListHTML += `
                        <div class="p-3 bg-red-950/40 border border-red-500/40 rounded-lg flex items-start gap-3 col-span-1 md:col-span-2 shadow-[0_0_15px_rgba(239,68,68,0.15)] animate-pulse font-mono">
                            ${getSVGIcon('alert-octagon', 'text-red-400 w-5 h-5 shrink-0 mt-0.5 animate-bounce')}
                            <div>
                                <h4 class="font-bold text-red-400 text-xs uppercase tracking-wide">Critical Pick-Face Expirations (Level 01)</h4>
                                <p class="text-[11px] text-slate-300 mt-1">Detected <span class="font-bold text-red-400 font-mono">${level01Exp15} active ground-level pallet(s)</span> expiring in under 15 days. These demand immediate physical slot clearance to prevent picking stock anomalies.</p>
                            </div>
                        </div>
                    `;
                }
                if (fc.overcapacity > 0) {
                    advisoryListHTML += `
                        <div class="p-3 bg-red-950/20 border border-red-500/20 rounded-lg flex items-start gap-3 font-mono">
                            ${getSVGIcon('alert-triangle', 'text-red-400 w-5 h-5 shrink-0 mt-0.5')}
                            <div>
                                <h4 class="font-bold text-white text-xs">Overfilled Locator Warning</h4>
                                <p class="text-[11px] text-slate-400">Detected ${fc.overcapacity} overfilled positions exceeding system-configured physical bounds. Direct operations to check physical height limits immediately.</p>
                            </div>
                        </div>
                    `;
                }
                if (fc.duplicates > 0) {
                    advisoryListHTML += `
                        <div class="p-3 bg-red-950/20 border border-red-500/20 rounded-lg flex items-start gap-3 font-mono">
                            ${getSVGIcon('layers', 'text-red-400 w-5 h-5 shrink-0 mt-0.5')}
                            <div>
                                <h4 class="font-bold text-white text-xs">Duplicate LPN Ghost Records</h4>
                                <p class="text-[11px] text-slate-400">Identified identical Pallet LPN codes (${fc.duplicates}) tracked in different coordinates. This indicates severe scan errors during putaway.</p>
                            </div>
                        </div>
                    `;
                }
                if (fc.shuttleSingle > 0) {
                    advisoryListHTML += `
                        <div class="p-3 bg-yellow-950/20 border border-yellow-500/20 rounded-lg flex items-start gap-3 font-mono">
                            ${getSVGIcon('clock', 'text-yellow-400 w-5 h-5 shrink-0 mt-0.5')}
                            <div>
                                <h4 class="font-bold text-white text-xs">Underutilized Shuttle Lanes</h4>
                                <p class="text-[11px] text-slate-400">Found single pallets blocking deep corridors designed for 10. Consolidate these out to standard racking to free up capacity.</p>
                            </div>
                        </div>
                    `;
                }
                if (fc.multiItem > 0) {
                    advisoryListHTML += `
                        <div class="p-3 bg-orange-950/20 border border-orange-500/20 rounded-lg flex items-start gap-3 font-mono">
                            ${getSVGIcon('layers', 'text-orange-400 w-5 h-5 shrink-0 mt-0.5')}
                            <div>
                                <h4 class="font-bold text-white text-xs">Mixed SKU Picking Hazard</h4>
                                <p class="text-[11px] text-slate-400">Found different product SKUs co-mingled in single positions. Initiate pick-face segregation tasks to lower shipping errors.</p>
                            </div>
                        </div>
                    `;
                }
            }

            if (advisoryListHTML === '') {
                advisoryListHTML = `
                    <div class="p-6 text-center text-slate-500 text-xs col-span-2 font-mono">
                        ${getSVGIcon('check-circle', 'text-green-400 mx-auto mb-2 opacity-50 w-8 h-8')}
                        WMS operations are healthy. No inventory exception anomalies tracked!
                    </div>
                `;
            }
            
            setTxt('advisories', advisoryListHTML);

            const filteredFlagCounts = getIssueCounts(globallyFiltered);
            FLAG_CARD_CONFIG.forEach(flag => setTxt(`flag-${flag.key}`, filteredFlagCounts[flag.key] || 0));

            const level01TableBody = document.getElementById('tbody-level01-expiries');
            if (level01TableBody) {
                const level01Rows = globallyFiltered.filter(row => {
                    const rowLevelClean = String(row.Level).trim().padStart(2, '0');
                    return rowLevelClean === '01' && row._expDateObj && row._expDateObj <= plus15;
                });
                setTxt('level01-badge', `${level01Rows.length} Critical Pallets`);
                level01TableBody.innerHTML = level01Rows.slice(0, 15).map(row => `
                    <tr class="hover:bg-slate-800/40 transition-colors font-mono">
                        <td class="py-2 text-white font-bold">${row['Locator']}</td>
                        <td class="py-2 text-slate-300 font-medium">${row['Item Code']}</td>
                        <td class="py-2 text-slate-400">${row['LPN NO']}</td>
                        <td class="py-2 text-red-400 font-bold">${row['EXP Date']}</td>
                        <td class="py-2 text-right text-slate-400">${formatNumber(row['CS QTY'])}</td>
                    </tr>
                `).join('');

                if (level01Rows.length === 0) {
                    level01TableBody.innerHTML = `
                        <tr>
                            <td colSpan="5" class="py-12 text-center text-slate-500 text-xs">
                                <span class="flex flex-col items-center gap-1 font-mono">
                                    <svg class="w-8 h-8 text-green-400 opacity-50" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                                    No critical ground-level picking shelf expiries found!
                                </span>
                            </td>
                        </tr>
                    `;
                }
            }

            const allExpiryTableBody = document.getElementById('tbody-all-expiries');
            if (allExpiryTableBody) {
                const allExpiryRows = globallyFiltered.filter(row => {
                    return row._action !== "Bulk Location — Excluded" && row._expDateObj && row._expDateObj <= plus90;
                });
                setTxt('all-expiry-badge', `${allExpiryRows.length} Alerts`);
                allExpiryTableBody.innerHTML = allExpiryRows.slice(0, 15).map(row => {
                    const severityColor = row._expDateObj <= now ? 'text-red-500 font-bold font-mono' : (row._expDateObj <= plus30 ? 'text-orange-400 font-medium font-mono' : 'text-yellow-400 font-mono');
                    return `
                        <tr class="hover:bg-slate-800/40 transition-colors font-mono">
                            <td class="py-2">${row['Locator']}</td>
                            <td class="py-2 text-slate-300 font-medium">${row['Item Code']}</td>
                            <td class="py-2 ${severityColor}">${row['EXP Date']}</td>
                            <td class="py-2 text-right text-slate-400">${formatNumber(row['CS QTY'])}</td>
                        </tr>
                    `;
                }).join('');

                if (allExpiryRows.length === 0) {
                    allExpiryTableBody.innerHTML = `
                        <tr>
                            <td colSpan="4" class="py-12 text-center text-slate-500 text-xs font-mono">
                                No expiring stock tracked!
                            </td>
                        </tr>
                    `;
                }
            }

            const matrixTableBody = document.getElementById('tbody-matrix-org');
            if (matrixTableBody) {
                const summariesFiltered = {};
                state.uniqueOrgs.forEach(org => {
                    summariesFiltered[org] = {};
                    ACTION_LABELS.forEach(act => { summariesFiltered[org][act] = { count: 0 }; });
                });
                globallyFiltered.forEach(row => {
                    const org = row['Org Code'];
                    const issues = Array.isArray(row._issues) ? row._issues : [row._action];
                    issues.forEach(act => {
                        if (summariesFiltered[org] && summariesFiltered[org][act]) {
                            summariesFiltered[org][act].count++;
                        }
                    });
                });
                matrixTableBody.innerHTML = state.uniqueOrgs.flatMap(org => 
                    ACTION_LABELS.map(act => {
                        const stat = summariesFiltered[org]?.[act] || { count: 0 };
                        if (stat.count === 0) return '';
                        const color = getActionColor(act);
                        return `
                            <tr class="hover:bg-slate-800/40 transition-colors font-mono">
                                <td class="py-2.5 font-bold text-white">${org}</td>
                                <td class="py-2.5 flex items-center gap-1.5" style="color: ${color}">
                                    <span class="w-1.5 h-1.5 rounded-full" style="background-color: ${color}"></span>
                                    ${act}
                                </td>
                                <td class="py-2.5 text-right font-semibold text-slate-300">${formatNumber(stat.count)}</td>
                            </tr>
                        `;
                    })
                ).filter(Boolean).join('');
                
                if (globallyFiltered.length === 0) {
                     matrixTableBody.innerHTML = `
                        <tr>
                            <td colSpan="3" class="py-12 text-center text-slate-500 text-xs font-mono">
                                No records match the current filter.
                            </td>
                        </tr>
                    `;
                }
            }

            let filteredAvailTotal = 0;
            let filteredAvailCats = {};
            const talliedLocs = new Set();

            if (state.locData && state.locData.length > 0) {
                const headers = Object.keys(state.locData[0]);
                
                const storageKeyLoc = headers.find(h => h.trim().toLowerCase() === 'storage');
                const locKeyLoc = headers.find(h => {
                    const low = h.trim().toLowerCase();
                    return low === 'location' || low === 'locator' || low.includes('location') || low.includes('locator');
                });
                const whKeyLoc = headers.find(h => {
                    const low = h.trim().toLowerCase();
                    return low === 'org code' || low === 'org' || low === 'warehouse org' || low === 'orgcode' || low === 'wh org' || low === 'organization' || low === 'warehouse name' || low === 'warehouse' || low.includes('warehouse');
                });
                const zoneKeyLoc = headers.find(h => {
                    const low = h.trim().toLowerCase();
                    return low === 'zone name' || low === 'zone_name' || low === 'zone' || low.includes('zone');
                });
                
                state.locData.forEach(locRow => {
                    const locVal = String(locRow['Location'] || locRow['Locator'] || (locKeyLoc ? locRow[locKeyLoc] : '') || '').trim();
                    if (!locVal) return;

                    const rawStorageVal = String(locRow['Storage'] || (storageKeyLoc ? locRow[storageKeyLoc] : '') || '').trim();
                    const cat = determineStorageCategory(rawStorageVal);

                    const rawZoneVal = String(locRow['Zone Name'] || locRow['Zone'] || (zoneKeyLoc ? locRow[zoneKeyLoc] : '') || '').trim();
                    const zoneVal = rawZoneVal ? (state.zoneMapping.get(rawZoneVal.toLowerCase()) || rawZoneVal) : 'Unassigned';

                    const whVal = String(locRow['Warehouse Name'] || locRow['Warehouse'] || locRow['Org Code'] || (whKeyLoc ? locRow[whKeyLoc] : '') || '').trim();

                    if (state.filters.zones && state.filters.zones.length > 0 && zoneVal && !state.filters.zones.includes(zoneVal)) return;
                    if (state.filters.orgCodes && state.filters.orgCodes.length > 0 && whVal && !state.filters.orgCodes.includes(whVal)) return;

                    if (state.filters.search) {
                         const searchTerms = state.filters.search.toLowerCase().split(',').map(s => s.trim()).filter(Boolean);
                         if (searchTerms.length > 0) {
                             const matchesAny = searchTerms.some(s => locVal.toLowerCase().includes(s));
                             if (!matchesAny) return;
                         }
                    }

                    if (!talliedLocs.has(locVal)) {
                        if (cat === 'Dummy Location Bucket' || !isBulkLocator(locVal)) {
                            talliedLocs.add(locVal);
                            filteredAvailTotal++;
                            if (!state.filters.storageTypes || state.filters.storageTypes.length === 0 || state.filters.storageTypes.includes(cat)) {
                                filteredAvailCats[cat] = (filteredAvailCats[cat] || 0) + 1;
                            }
                        }
                    }
                });
            }

            state.processedData.forEach(row => {
                const locVal = row['Locator'];
                if (locVal && !talliedLocs.has(locVal)) {
                    if (state.filters.zones && state.filters.zones.length > 0 && row['Zone'] && !state.filters.zones.includes(row['Zone'])) return;
                    if (state.filters.orgCodes && state.filters.orgCodes.length > 0 && row['Org Code'] && !state.filters.orgCodes.includes(row['Org Code'])) return;
                    if (state.filters.search) {
                        const searchTerms = state.filters.search.toLowerCase().split(',').map(s => s.trim()).filter(Boolean);
                        if (searchTerms.length > 0) {
                            const matchesAny = searchTerms.some(s => locVal.toLowerCase().includes(s));
                            if (!matchesAny) return;
                        }
                    }

                    const cat = row._storageCategory;
                    if (cat !== 'Dummy Location Bucket' && !isBulkLocator(locVal)) {
                        talliedLocs.add(locVal);
                        filteredAvailTotal++;
                        
                        if (!state.filters.storageTypes || state.filters.storageTypes.length === 0 || state.filters.storageTypes.includes(cat)) {
                            filteredAvailCats[cat] = (filteredAvailCats[cat] || 0) + 1;
                        }
                    }
                }
            });

            const computedLocsMeta = new Map();
            globallyFiltered.forEach(row => {
                 computedLocsMeta.set(row.Locator, row._storageCategory);
            });

            const usedCounts = { total: computedLocsMeta.size, categories: {} };
            computedLocsMeta.forEach(storageCat => {
                usedCounts.categories[storageCat] = (usedCounts.categories[storageCat] || 0) + 1;
            });

            let availHTML = `
                <div class="flex items-center gap-2 shrink-0 border-r border-slate-800 pr-6 mr-2">
                    <span class="text-[10px] font-bold text-slate-500 uppercase tracking-widest font-mono">Total Locs</span>
                    <span class="text-lg font-extrabold text-white font-mono">${formatNumber(filteredAvailTotal)}</span>
                </div>
                <div class="flex items-center gap-2 shrink-0 mr-4">
                    <span class="text-[10px] font-bold text-slate-500 uppercase tracking-widest font-mono">Normal Physical Storage</span>
                    <span class="text-lg font-extrabold text-green-400 font-mono">${formatNumber(filteredAvailCats['Normal Physical Storage'] || 0)}</span>
                </div>
                <div class="flex items-center gap-2 shrink-0 mr-4">
                    <span class="text-[10px] font-bold text-slate-500 uppercase tracking-widest font-mono">Radio Shuttle</span>
                    <span class="text-lg font-extrabold text-cyan-400 font-mono">${formatNumber(filteredAvailCats['Radio Shuttle'] || 0)}</span>
                </div>
                <div class="flex items-center gap-2 shrink-0 mr-4">
                    <span class="text-[10px] font-bold text-slate-500 uppercase tracking-widest font-mono">Bins</span>
                    <span class="text-lg font-extrabold text-indigo-400 font-mono">${formatNumber(filteredAvailCats['Bins'] || 0)}</span>
                </div>
                <div class="flex items-center gap-2 shrink-0 mr-4">
                    <span class="text-[10px] font-bold text-slate-500 uppercase tracking-widest font-mono">Shelves</span>
                    <span class="text-lg font-extrabold text-purple-400 font-mono">${formatNumber(filteredAvailCats['Shelves'] || 0)}</span>
                </div>
                <div class="flex items-center gap-2 shrink-0 mr-4">
                    <span class="text-[10px] font-bold text-slate-500 uppercase tracking-widest font-mono">POS</span>
                    <span class="text-lg font-extrabold text-amber-500 font-mono">${formatNumber(filteredAvailCats['POS'] || 0)}</span>
                </div>
                <div class="flex items-center gap-2 shrink-0">
                    <span class="text-[10px] font-bold text-slate-500 uppercase tracking-widest font-mono">Dummy Location Bucket</span>
                    <span class="text-lg font-extrabold text-red-500 font-mono">${formatNumber(filteredAvailCats['Dummy Location Bucket'] || 0)}</span>
                </div>
            `;

            let usedHTML = `
                <div class="flex items-center gap-2 shrink-0 border-r border-slate-800 pr-6 mr-2">
                    <span class="text-[10px] font-bold text-slate-500 uppercase tracking-widest font-mono">Total Used Locs</span>
                    <span class="text-lg font-extrabold text-white font-mono">${formatNumber(usedCounts.total)}</span>
                </div>
                <div class="flex items-center gap-2 shrink-0 mr-4">
                    <span class="text-[10px] font-bold text-slate-500 uppercase tracking-widest font-mono">Used Normal Physical Storage</span>
                    <span class="text-lg font-extrabold text-green-400 font-mono">${formatNumber(usedCounts.categories['Normal Physical Storage'] || 0)}</span>
                </div>
                <div class="flex items-center gap-2 shrink-0 mr-4">
                    <span class="text-[10px] font-bold text-slate-500 uppercase tracking-widest font-mono">Used Radio Shuttle</span>
                    <span class="text-lg font-extrabold text-cyan-400 font-mono">${formatNumber(usedCounts.categories['Radio Shuttle'] || 0)}</span>
                </div>
                <div class="flex items-center gap-2 shrink-0 mr-4">
                    <span class="text-[10px] font-bold text-slate-500 uppercase tracking-widest font-mono">Used Bins</span>
                    <span class="text-lg font-extrabold text-indigo-400 font-mono">${formatNumber(usedCounts.categories['Bins'] || 0)}</span>
                </div>
                <div class="flex items-center gap-2 shrink-0 mr-4">
                    <span class="text-[10px] font-bold text-slate-500 uppercase tracking-widest font-mono">Used Shelves</span>
                    <span class="text-lg font-extrabold text-purple-400 font-mono">${formatNumber(usedCounts.categories['Shelves'] || 0)}</span>
                </div>
                <div class="flex items-center gap-2 shrink-0 mr-4">
                    <span class="text-[10px] font-bold text-slate-500 uppercase tracking-widest font-mono">Used POS</span>
                    <span class="text-lg font-extrabold text-amber-500 font-mono">${formatNumber(usedCounts.categories['POS'] || 0)}</span>
                </div>
                <div class="flex items-center gap-2 shrink-0">
                    <span class="text-[10px] font-bold text-slate-500 uppercase tracking-widest font-mono">Used Dummy Location Bucket</span>
                    <span class="text-lg font-extrabold text-red-500 font-mono">${formatNumber(usedCounts.categories['Dummy Location Bucket'] || 0)}</span>
                </div>
            `;

            const kpiRowAvail = document.getElementById('kpi-row-avail');
            const kpiRowUsed = document.getElementById('kpi-row-used');
            
            if (kpiRowAvail) kpiRowAvail.innerHTML = availHTML;
            if (kpiRowUsed) kpiRowUsed.innerHTML = usedHTML;

            if (state.chartInstance) {
                const chartData = getChartData();
                state.chartInstance.data.labels = chartData.map(item => item.name);
                state.chartInstance.data.datasets[0].data = chartData.map(item => item.value);
                
                if (state.filters.headerFilters._action && state.filters.headerFilters._action.length > 0) {
                    state.chartInstance.data.datasets[0].backgroundColor = chartData.map(item => 
                        state.filters.headerFilters._action.includes(item.name) ? item.color : '#1e293b'
                    );
                } else {
                    state.chartInstance.data.datasets[0].backgroundColor = chartData.map(item => item.color);
                }
                state.chartInstance.update();
            }
        }

        const renderCharts = () => {
            const ctx = document.getElementById('issueDistributionChart');
            if (!ctx) return;
            if (state.chartInstance) {
                try { state.chartInstance.destroy(); } catch(e) {}
                state.chartInstance = null;
            }
            const chartData = getChartData();
            state.chartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: chartData.map(item => item.name),
                    datasets: [{
                        data: chartData.map(item => item.value),
                        backgroundColor: chartData.map(item => item.color),
                        borderRadius: 4,
                        borderWidth: 0,
                        barThickness: 16,
                        hoverBackgroundColor: '#38bdf8'
                    }]
                },
                options: {
                    indexAxis: 'y',
                    responsive: true,
                    maintainAspectRatio: false,
                    onClick: (event, elements) => {
                        if (elements.length > 0) {
                            const index = elements[0].index;
                            const actionName = state.chartInstance.data.labels[index];
                            window.toggleHeaderFilterVal('_action', actionName);
                        }
                    },
                    onHover: (event, elements) => {
                        event.native.target.style.cursor = elements.length > 0 ? 'pointer' : 'default';
                    },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: '#0f172a',
                            borderColor: '#1e293b',
                            borderWidth: 1,
                            titleColor: '#fff',
                            bodyColor: '#cbd5e1',
                            callbacks: {
                                label: (context) => ` count: ${formatNumber(context.raw)}`
                            }
                        }
                    },
                    scales: {
                        x: {
                            grid: { color: '#1e293b' },
                            ticks: { color: '#64748b' }
                        },
                        y: {
                            grid: { display: false },
                            ticks: { 
                                color: '#94a3b8',
                                font: { size: 10 }
                            }
                        }
                    }
                }
            });
        };

        if (document.readyState === 'complete' || document.readyState === 'interactive') {
            render();
        } else {
            window.addEventListener('DOMContentLoaded', render);
        }
    </script>
</body>
</html>
